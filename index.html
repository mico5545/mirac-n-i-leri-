<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050301">
    <title>Damla İçin Eşsiz Bir Şaheser</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f9f1cc;
            --blue-primary: #00f0ff;
            --bg-dark: #050301;
            --glass-bg: rgba(15, 10, 5, 0.7);
            --glass-border: rgba(212, 175, 55, 0.4);
            --text-light: #fdf5e6;
            
            --z-bg: 0;
            --z-canvas: 1;
            --z-particles: 5;
            --z-card: 10;
            --z-interactions: 20;
            --z-butterflies: 50;
            --z-shooting-stars: 200;
            --z-toast: 1000;
            --z-lock: 999999;     
            --z-overlay: 50000;
            --z-loading: 9999999;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: #fff;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        /* Yükleme Ekranı */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-dark); z-index: var(--z-loading);
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease-in-out;
        }
        .loader-ring { width: 70px; height: 70px; border: 4px solid rgba(212, 175, 55, 0.1); border-top: 4px solid var(--gold-primary); border-radius: 50%; animation: spinRing 1.5s linear infinite; margin-bottom: 20px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-text { color: var(--gold-primary); font-size: 1.1rem; letter-spacing: 3px; font-style: italic; }

        /* Sihri Başlat Ekranı */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 3, 1, 0.95); backdrop-filter: blur(15px);
            z-index: var(--z-overlay); display: none; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s;
        }
        .start-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(138, 115, 34, 0.4)); border: 2px solid var(--gold-primary);
            color: var(--gold-light); padding: 18px 40px; font-size: 1.4rem; border-radius: 50px; cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); animation: pulseStartBtn 2s infinite alternate;
        }
        @keyframes pulseStartBtn { 0% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); } 100% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.8); } }

        /* Arka Plan */
        .art-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(20, 10, 0, 0.25), rgba(30, 15, 0, 0.45)), url('https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg');
            background-size: cover; background-position: center; z-index: var(--z-bg);
        }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: var(--z-canvas); pointer-events: none; }

        /* Responsive Kart Tasarımı */
        .card-wrapper {
            position: relative; z-index: var(--z-card);
            width: 90vw; max-width: 400px; display: flex; justify-content: center; align-items: center;
        }
        .card {
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); padding: 40px 25px; border-radius: 20px; text-align: center;
            width: 100%; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.15);
            transition: opacity 0.6s, transform 0.6s;
        }
        .card-wrapper.hide .card { opacity: 0; transform: scale(0.5) translateY(100px); pointer-events: none; }
        .card h1 { font-size: 28px; margin-bottom: 12px; color: var(--gold-primary); font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 10px rgba(212, 175, 55, 0.6); }
        .card p.message { font-size: 15px; line-height: 1.6; margin-bottom: 25px; color: var(--text-light); font-style: italic; }
        
        .button-group { display: flex; gap: 12px; justify-content: center; }
        .btn-magic {
            padding: 12px 25px; background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-primary);
            border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; flex: 1;
        }
        .btn-magic:active { transform: scale(0.95); }

        /* Merkezî Bildirim (Modal) */
        #center-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
            z-index: var(--z-toast); display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        #center-modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: linear-gradient(135deg, rgba(25, 20, 15, 0.95), rgba(10, 5, 2, 0.98)); border: 2px solid var(--gold-primary); border-radius: 20px; padding: 35px 25px; text-align: center;
            width: 85vw; max-width: 360px; box-shadow: 0 0 40px rgba(212, 175, 55, 0.5); transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #center-modal.active .modal-content { transform: scale(1); }
        .modal-icon { font-size: 45px; margin-bottom: 15px; }
        .modal-text { color: var(--text-light); font-size: 1.2rem; line-height: 1.5; margin-bottom: 25px; font-style: italic; }
        .modal-btn { background: var(--gold-primary); color: #000; border: none; padding: 10px 30px; font-size: 1rem; font-weight: bold; border-radius: 25px; cursor: pointer; }

        /* Zaman Kilidi */
        #time-lock {
            position: fixed; bottom: 30px; right: 30px; font-size: 42px;
            cursor: pointer; z-index: var(--z-lock);
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8));
            animation: floatLock 3s infinite ease-in-out;
            padding: 10px;
        }
        @keyframes floatLock { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        /* YUMUŞAK HATLI, EFEKTLİ VE GEZEN MAVİ YILDIZ */
        #hidden-blue-star {
            position: fixed;
            width: 50px; height: 50px;
            z-index: var(--z-particles);
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            animation: floatStar 16s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 20px var(--blue-primary)) drop-shadow(0 0 40px rgba(0, 240, 255, 0.5));
        }

        .blue-star-shape {
            width: 60%; height: 60%;
            background: #ffffff; /* Merkezde yoğun beyaz parlama */
            border-radius: 50%;
            box-shadow: 0 0 20px 8px var(--blue-primary), 0 0 40px 15px rgba(0, 240, 255, 0.6);
            animation: softPulse 3s infinite alternate ease-in-out;
        }

        @keyframes softPulse {
            0% { transform: scale(0.8); opacity: 0.7; filter: blur(1px); }
            100% { transform: scale(1.2); opacity: 1; filter: blur(0px); }
        }

        @keyframes floatStar {
            0% { top: 18vh; left: 15vw; }
            33% { top: 70vh; left: 75vw; }
            66% { top: 25vh; left: 80vw; }
            100% { top: 65vh; left: 20vw; }
        }

        /* Efektler */
        .butterfly { position: fixed; font-size: 40px; z-index: var(--z-butterflies); cursor: pointer; filter: drop-shadow(0 0 10px rgba(0, 195, 255, 0.8)); animation-fill-mode: forwards; animation-timing-function: linear; }
        @keyframes flyPath1 { 0% { transform: translate3d(0, 110vh, 0) scale(0.8); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate3d(30px, -20vh, 0) scale(1); opacity: 0; } }
        @keyframes flyPath2 { 0% { transform: translate3d(0, 110vh, 0) scale(1); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate3d(-30px, -20vh, 0) scale(0.8); opacity: 0; } }
        
        .shooting-star-container { position: fixed; top: -50px; right: -50px; width: 120px; height: 120px; z-index: var(--z-shooting-stars); cursor: pointer; animation: starShoot 6s linear forwards; }
        .shooting-star-core { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #fff; box-shadow: 0 0 20px #fff, 0 0 40px var(--gold-primary); border-radius: 50%; transform: translate(-50%, -50%); }
        .shooting-star-tail { position: absolute; top: 50%; right: 50%; width: 200px; height: 2px; background: linear-gradient(270deg, #fff, var(--gold-primary), transparent); transform-origin: right; transform: translateY(-50%) rotate(35deg); }
        @keyframes starShoot { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-130vw, 130vh); opacity: 0; } }

        .heart-particle { position: fixed; font-size: 26px; z-index: 99999; pointer-events: none; animation: popOut 0.8s ease-out forwards; }
        @keyframes popOut { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); opacity: 0; } }

        .ripple-effect { position: fixed; border: 2px solid rgba(0, 240, 255, 0.8); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); animation: ripple 0.8s ease-out forwards; z-index: var(--z-interactions); }
        @keyframes ripple { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 120px; height: 120px; opacity: 0; border-width: 0px; } }

        /* Final Mavi İsim */
        #magic-text-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 20px; }
        #giant-name { font-family: 'Great Vibes', cursive; font-size: clamp(4rem, 15vw, 6.5rem); color: var(--blue-primary); text-shadow: 0 0 30px rgba(0, 240, 255, 0.9); opacity: 0; transform: scale(0.5); transition: 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #giant-name.show { opacity: 1; transform: scale(1); }
        #typewriter-text { margin-top: 20px; font-size: clamp(1.1rem, 4vw, 1.4rem); color: #fff; text-align: center; max-width: 90%; min-height: 80px; font-style: italic; text-shadow: 0 2px 10px #000; line-height: 1.5; }
        .cursor-blink { display: inline-block; width: 2px; height: 1.2rem; background-color: var(--gold-primary); margin-left: 4px; animation: blinker 0.8s infinite; vertical-align: middle; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div class="loader-text">Damla'nın dünyasına bağlanılıyor...</div>
    </div>

    <div id="start-overlay">
        <button class="start-btn" id="btn-start">Sihri Başlat ✨</button>
    </div>

    <audio id="bg-audio" loop></audio>

    <div class="art-background" id="parallax-bg"></div>
    <canvas id="particle-canvas"></canvas>
    
    <!-- Yumuşak efektli gezen mavi yıldız -->
    <div id="hidden-blue-star"><div class="blue-star-shape"></div></div>
    
    <div id="time-lock">⏳</div>

    <div id="magic-text-container">
        <div id="giant-name">Damla</div>
        <div id="typewriter-text"></div>
    </div>

    <div class="card-wrapper" id="main-card">
        <div class="card">
            <h1>Merhaba Damla</h1>
            <p class="message">Ekranda uçuşan mavi kelebeklerden birini yakalamayı dene...</p>
            <div class="button-group">
                <button class="btn-magic" onclick="triggerMagic('1', event)">İyi</button>
                <button class="btn-magic" onclick="triggerMagic('2', event)">Çok İyi</button>
            </div>
        </div>
    </div>

    <div id="center-modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">✨</div>
            <div class="modal-text" id="modal-text">Mesaj...</div>
            <button class="modal-btn" id="modal-close-btn">Gülümsedim</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            texts: {
                msg1: "Klimt bu tabloyu çizerken dünyanın en güzel altın sarısını kullandı... Ama sanırım o mavi bakışlarına hiç denk gelmemişti.",
                msg2: "Tarihin en ünlü eserleri altın yaldızlarla işlenmiş olabilir, ama bence o mavi gözlerin hiçbir tabloya sığmayacak kadar güzel..."
            },
            audio: { gunduz: "1.mp3", gece: "2.mp3" },
            timings: { butterflySpawnRate: 1800, shootingStarRate: 10000, typewriterSpeed: 45 }
        };

        const els = {
            loading: document.getElementById('loading-screen'),
            startOverlay: document.getElementById('start-overlay'),
            btnStart: document.getElementById('btn-start'),
            audio: document.getElementById('bg-audio'),
            cardWrap: document.getElementById('main-card'),
            bg: document.getElementById('parallax-bg'),
            modal: document.getElementById('center-modal'),
            modalIcon: document.getElementById('modal-icon'),
            modalText: document.getElementById('modal-text'),
            modalBtn: document.getElementById('modal-close-btn'),
            timeLock: document.getElementById('time-lock'),
            blueStar: document.getElementById('hidden-blue-star'),
            giantName: document.getElementById('giant-name'),
            typewriter: document.getElementById('typewriter-text'),
            canvas: document.getElementById('particle-canvas')
        };

        let isAppActive = false;
        let starCatchCount = 0;
        let magicStarted = false;

        window.addEventListener('load', () => {
            setMusicByTime();
            setTimeout(() => {
                els.loading.style.opacity = '0';
                setTimeout(() => {
                    els.loading.style.display = 'none';
                    els.startOverlay.style.display = 'flex';
                }, 800);
            }, 1500);
        });

        function setMusicByTime() {
            const hour = new Date().getHours();
            els.audio.src = (hour >= 6 && hour < 19) ? CONFIG.audio.gunduz : CONFIG.audio.gece;
            els.audio.load();
        }

        els.btnStart.addEventListener('click', async () => {
            els.audio.play().catch(e => console.log("Ses hatası:", e));
            els.startOverlay.style.opacity = '0';
            setTimeout(() => {
                els.startOverlay.style.display = 'none';
                magicStarted = true;
                initCanvasParticles();
            }, 500);
        });

        document.addEventListener('mousemove', (e) => {
            if (!magicStarted) return;
            const moveX = (window.innerWidth / 2 - e.pageX) / 60;
            const moveY = (window.innerHeight / 2 - e.pageY) / 60;
            els.bg.style.transform = `translate3d(${-moveX}px, ${-moveY}px, 0) scale(1.05)`;
            els.cardWrap.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;
        });

        let autoCloseModalTimer;
        function showBigNotification(icon, message, duration = 6000) {
            clearTimeout(autoCloseModalTimer);
            els.modalIcon.innerHTML = icon; els.modalText.innerHTML = message;
            els.modal.classList.add('active');
            autoCloseModalTimer = setTimeout(() => { closeModal(); }, duration);
        }
        function closeModal() { els.modal.classList.remove('active'); }
        els.modalBtn.addEventListener('click', () => { clearTimeout(autoCloseModalTimer); closeModal(); });

        function checkTimeStatus() {
            const hour = new Date().getHours();
            els.timeLock.innerHTML = (hour >= 19 || hour < 6) ? '🌙' : '⏳';
        }
        setInterval(checkTimeStatus, 60000); checkTimeStatus();

        els.timeLock.addEventListener('click', (e) => {
            e.stopPropagation();
            const hour = new Date().getHours();
            if (hour >= 19 || hour < 6) showBigNotification('🌙', "Bu gece o mavi gözlerin her zamankinden daha güzel parlıyor...", 7000);
            else showBigNotification('⏳', "Güneşin batmasını bekle, asıl sürpriz akşam 7'den sonra başlıyor...", 6000);
        });

        /* Gezen mavi yıldıza tıklandığında */
        els.blueStar.addEventListener('pointerdown', (e) => {
            e.stopPropagation(); 
            const rect = els.blueStar.getBoundingClientRect();
            explodeHearts(rect.left + rect.width/2, rect.top + rect.height/2, false);
            els.blueStar.style.display = 'none';
            showBigNotification('💙', "Milyonlarca yıldız arasında sadece biri maviydi... Tıpkı o gözler gibi.", 8000);
        });

        function onPointerDown(e) {
            if(e.target.closest('button') || e.target.classList.contains('butterfly') || e.target.closest('#center-modal') || !magicStarted) return;
            let x = e.clientX || (e.touches && e.touches[0].clientX); 
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            spawnRipple(x, y);
        }
        document.addEventListener('pointerdown', onPointerDown);

        function spawnRipple(x, y) {
            const ripple = document.createElement('div'); ripple.className = 'ripple-effect';
            ripple.style.left = x + 'px'; ripple.style.top = y + 'px';
            document.body.appendChild(ripple); setTimeout(() => ripple.remove(), 800);
        }

        setInterval(() => {
            if (isAppActive || !magicStarted) return; 
            const star = document.createElement('div'); star.className = 'shooting-star-container';
            star.innerHTML = `<div class="shooting-star-core"></div><div class="shooting-star-tail"></div>`;
            star.addEventListener('pointerdown', (e) => {
                e.stopPropagation(); e.preventDefault(); star.remove(); starCatchCount++;
                let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
                explodeHearts(x, y, true); 
                if (starCatchCount === 1) showBigNotification('🌠', "Hemen içinden bir dilek tut...", 6000);
                else showBigNotification('✨', "Kim bilir, belki de o tuttuğun dilek çoktan kabul olmuştur...", 7000);
            });
            document.body.appendChild(star); setTimeout(() => { if (document.body.contains(star)) star.remove(); }, 6000);
        }, CONFIG.timings.shootingStarRate);

        setInterval(() => {
            if (isAppActive || !magicStarted) return;
            const b = document.createElement('div'); b.innerHTML = '🦋'; b.className = 'butterfly';
            b.style.left = (Math.random() * 80 + 10) + 'vw'; const duration = Math.random() * 3 + 4; b.style.animationDuration = duration + 's';
            b.style.animationName = Math.random() > 0.5 ? 'flyPath1' : 'flyPath2';
            b.addEventListener('pointerdown', (e) => {
                e.preventDefault(); e.stopPropagation(); b.remove(); 
                let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
                explodeHearts(x, y, false); 
            });
            document.body.appendChild(b); setTimeout(() => { if (document.body.contains(b)) b.remove(); }, duration * 1000);
        }, CONFIG.timings.butterflySpawnRate);

        function explodeHearts(x, y, isGoldMode = false) {
            const emojis = isGoldMode ? ['✨', '⭐', '🌟', '💫'] : ['💙', '💛', '💖', '🦋']; 
            const particleCount = isGoldMode ? 12 : 8; 
            for(let i = 0; i < particleCount; i++) {
                const p = document.createElement('div'); p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)]; p.className = 'heart-particle';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2, velocity = Math.random() * 120 + 80;
                p.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`); p.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`); p.style.setProperty('--rot', `${(Math.random() - 0.5) * 360}deg`);
                document.body.appendChild(p); setTimeout(() => { if(document.body.contains(p)) p.remove(); }, 800);
            }
        }

        function typeWriterEffect(text, index, element, callback) {
            if (index === 0) element.innerHTML = '<span class="cursor-blink"></span>';
            if (index < text.length) {
                element.innerHTML = text.substring(0, index + 1) + '<span class="cursor-blink"></span>';
                setTimeout(() => typeWriterEffect(text, index + 1, element, callback), CONFIG.timings.typewriterSpeed); 
            } else { if(callback) callback(); }
        }

        function triggerMagic(type, e) {
            e.stopPropagation(); if(isAppActive) return; isAppActive = true;
            els.cardWrap.classList.add('hide'); els.timeLock.style.display = 'none'; els.blueStar.style.display = 'none'; els.typewriter.innerHTML = '';
            els.bg.style.filter = "brightness(0.3)";
            setTimeout(() => {
                els.giantName.classList.add('show');
                setTimeout(() => {
                    const message = type == "1" ? CONFIG.texts.msg1 : CONFIG.texts.msg2;
                    typeWriterEffect(message, 0, els.typewriter, () => { setTimeout(resetMagicScene, 7000); });
                }, 1200);
            }, 500);
        }

        function resetMagicScene() {
            els.giantName.classList.remove('show'); els.typewriter.innerHTML = ''; els.bg.style.filter = ""; 
            setTimeout(() => { els.cardWrap.classList.remove('hide'); els.timeLock.style.display = 'block'; isAppActive = false; }, 1000);
        }

        function initCanvasParticles() {
            const ctx = els.canvas.getContext('2d'); let particles = [];
            function resizeCanvas() { els.canvas.width = window.innerWidth; els.canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas); resizeCanvas();

            class ConstellationParticle {
                constructor() { this.x = Math.random() * els.canvas.width; this.y = Math.random() * els.canvas.height; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 2 + 0.5; this.baseAlpha = Math.random() * 0.5 + 0.1; }
                update() { this.x += this.vx; this.y += this.vy; if (this.x < 0) this.x = els.canvas.width; if (this.x > els.canvas.width) this.x = 0; if (this.y < 0) this.y = els.canvas.height; if (this.y > els.canvas.height) this.y = 0; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(212, 175, 55, ${this.baseAlpha})`; ctx.fill(); }
            }

            for (let i = 0; i < 50; i++) particles.push(new ConstellationParticle());

            let mouse = { x: null, y: null };
            window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; }); window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
            window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive: true}); window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

            function animateCanvasEngine() {
                ctx.clearRect(0, 0, els.canvas.width, els.canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for (let j = i; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 110) { ctx.beginPath(); ctx.strokeStyle = `rgba(212, 175, 55, ${0.2 - distance/110})`; ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                    }
                }
                requestAnimationFrame(animateCanvasEngine);
            }
            animateCanvasEngine(); 
        }
    </script>
</body>
</html>
