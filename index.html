<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merhaba Damla</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif; }

        body {
            background-color: #0c0804;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            color: #fff;
            perspective: 1000px;
            touch-action: manipulation; /* Telefonda çift tıklamayla yakınlaşmayı engeller */
        }

        /* The Kiss Tablosu Arka Planı */
        .art-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(12, 8, 4, 0.7), rgba(26, 17, 5, 0.85)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg');
            background-size: cover; background-position: center 20%;
            z-index: 0;
            animation: slowPan 30s infinite alternate ease-in-out;
        }

        @keyframes slowPan {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Ana Kart */
        .card-wrapper { position: relative; z-index: 10; perspective: 1000px; }

        .card {
            background: rgba(20, 15, 10, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 45px 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 420px; width: 90vw;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(212, 175, 55, 0.15);
            transition: transform 0.1s ease, opacity 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .card-wrapper.hide .card {
            transform: scale(0.6) translateY(80px) rotateX(30deg) !important;
            opacity: 0; pointer-events: none;
        }

        h1 {
            font-size: 28px; margin-bottom: 15px; color: #d4af37;
            font-weight: 600; letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }

        p.message {
            font-size: 15px; line-height: 1.7; margin-bottom: 35px;
            color: #e8dcc4; font-style: italic;
        }

        /* Butonlar */
        .button-group { display: flex; gap: 15px; justify-content: center; }

        button {
            padding: 12px 25px; background: transparent;
            border: 1px solid #d4af37; color: #d4af37;
            border-radius: 4px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.4s ease;
            position: relative; overflow: hidden;
        }

        button:active { transform: translateY(2px); }

        /* Büyü / Partikül Konteyneri */
        #magic-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* Dev İsim & Mesaj */
        #big-name {
            font-family: 'Great Vibes', cursive; font-size: 6rem; color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            opacity: 0; transform: scale(0.85); transition: all 1.8s ease;
        }
        #big-name.show { opacity: 1; transform: scale(1); }

        #final-message {
            margin-top: 25px; font-size: 1.2rem; color: #fdf5e6;
            text-align: center; max-width: 90%; min-height: 80px;
            font-style: italic;
        }

        /* Uçan Kelebekler */
        .butterfly {
            position: fixed; font-size: 35px; z-index: 50;
            cursor: pointer; animation: flyUp linear forwards;
            filter: drop-shadow(0 0 8px rgba(0, 195, 255, 0.6));
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        @keyframes flyUp {
            0% { transform: translateY(110vh) rotate(0deg) scale(1); opacity: 1; }
            25% { transform: translateY(70vh) translateX(30px) rotate(15deg) scale(1.1); }
            50% { transform: translateY(40vh) translateX(-20px) rotate(-10deg) scale(1); }
            75% { transform: translateY(10vh) translateX(20px) rotate(20deg) scale(1.2); }
            100% { transform: translateY(-20vh) rotate(0deg) scale(1); opacity: 0; }
        }

        /* Patlayan Kalpler */
        .heart-pop {
            position: fixed; font-size: 24px; z-index: 60;
            pointer-events: none; animation: popOut 1s ease-out forwards;
            filter: drop-shadow(0 0 5px rgba(255, 0, 100, 0.5));
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

    </style>
</head>
<body>

    <!-- Arka Plan Müzik (Dosya eklenecek) -->
    <audio id="bg-music" loop>
        <source src="billabong.mp3" type="audio/mpeg">
    </audio>

    <div class="art-background"></div>

    <div id="magic-container">
        <div id="big-name">Damla</div>
        <div id="final-message"></div>
    </div>

    <div class="card-wrapper" id="main-card-wrapper">
        <div class="card" id="card">
            <h1>Merhaba Damla</h1>
            <p class="message">Ekranda uçuşan mavi kelebeklerden birini yakalamayı dene...</p>
            
            <div class="button-group">
                <button onclick="triggerMagic(1)">İyi</button>
                <button onclick="triggerMagic(2)">Çok İyi</button>
            </div>
        </div>
    </div>

    <script>
        const messages = {
            1: "Klimt bu tabloyu çizerken dünyanın en güzel altın sarısını kullandı... Ama sanırım o mavi bakışlarına hiç denk gelmemişti.",
            2: "Tarihin en ünlü eserleri altın yaldızlarla işlenmiş olabilir, ama bence o mavi gözlerin hiçbir tabloya sığmayacak kadar güzel..."
        };

        // --- Müzik Başlatıcı ---
        function playMusic() {
            const music = document.getElementById('bg-music');
            if (music.paused) {
                music.play().catch(e => console.log("Otomatik oynatma engeli"));
            }
        }
        
        // Ekrana ilk dokunuşta müziği zorla başlat
        document.addEventListener('touchstart', playMusic, { once: true });
        document.addEventListener('click', playMusic, { once: true });

        // --- Uçan Kelebekler ---
        setInterval(spawnButterfly, 1500); // Her 1.5 saniyede bir kelebek çıkar

        function spawnButterfly() {
            const b = document.createElement('div');
            b.innerHTML = '🦋';
            b.className = 'butterfly';
            b.style.left = Math.random() * 85 + 'vw';
            
            // Hızları rastgele
            b.style.animationDuration = (Math.random() * 4 + 4) + 's'; 
            
            // Telefondan dokunma veya fareden tıklama olayları
            b.addEventListener('touchstart', (e) => catchButterfly(e, b), { passive: false });
            b.addEventListener('mousedown', (e) => catchButterfly(e, b));
            
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 9000); // Ekrandan çıkınca sil
        }

        // Kelebek Yakalama ve Patlama Efekti
        function catchButterfly(e, butterflyElement) {
            e.preventDefault();
            playMusic(); // Her ihtimale karşı müziği tetikle

            // Dokunulan koordinatları al
            let x, y;
            if (e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            // Kelebeği yok et
            butterflyElement.remove();
            
            // Kalpleri patlat
            createHearts(x, y);
        }

        function createHearts(x, y) {
            // Klimt ve mavi göz temasına uygun mavi ve sarı kalpler
            const heartColors = ['💙', '💛', '💖', '💙']; 
            
            for(let i = 0; i < 8; i++) {
                const h = document.createElement('div');
                h.innerHTML = heartColors[Math.floor(Math.random() * heartColors.length)];
                h.className = 'heart-pop';
                h.style.left = x + 'px';
                h.style.top = y + 'px';
                
                // Rastgele yönlere fırlatma hesaplamaları
                const tx = (Math.random() - 0.5) * 200; // Sağa sola
                const ty = (Math.random() - 1) * 200;   // Sadece yukarı
                const rot = (Math.random() - 0.5) * 180; // Rastgele dönme
                
                h.style.setProperty('--tx', `${tx}px`);
                h.style.setProperty('--ty', `${ty}px`);
                h.style.setProperty('--rot', `${rot}deg`);
                
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1000);
            }
        }

        // --- Daktilo ve Ana Animasyon ---
        let isAnimating = false;

        function typeWriter(text, i, elementId) {
            if (i < text.length) {
                document.getElementById(elementId).innerHTML = text.substring(0, i + 1);
                setTimeout(() => typeWriter(text, i + 1, elementId), 45); 
            }
        }

        function triggerMagic(type) {
            if(isAnimating) return;
            isAnimating = true;
            playMusic();

            const cardWrapper = document.getElementById('main-card-wrapper');
            const bigName = document.getElementById('big-name');
            const finalMessage = document.getElementById('final-message');
            
            cardWrapper.classList.add('hide');
            finalMessage.innerHTML = '';

            setTimeout(() => {
                bigName.classList.add('show');
                setTimeout(() => {
                    typeWriter(messages[type], 0, 'final-message');
                }, 1200);
            }, 600);

            setTimeout(() => {
                bigName.classList.remove('show');
                finalMessage.innerHTML = '';
                setTimeout(() => {
                    cardWrapper.classList.remove('hide');
                    isAnimating = false;
                }, 1500);
            }, 12000);
        }
    </script>
</body>
</html>
