<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merhaba Damla</title>
    <!-- Sanatsal yazı tipleri -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           BÖLÜM 1: GENEL AYARLAR VE DEĞİŞKENLER
           ========================================= */
        :root {
            --primary-gold: #d4af37;
            --light-gold: #f9f1cc;
            --dark-gold: #8a7322;
            --primary-blue: #00f0ff;
            --deep-blue: #0055ff;
            --glass-bg: rgba(15, 10, 5, 0.65);
            --glass-border: rgba(212, 175, 55, 0.4);
            --text-light: #fdf5e6;
            --bg-dark: #050301;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            perspective: 1200px;
            touch-action: none; /* Mobilde ekran kaymasını kesin engeller */
            user-select: none;
        }

        /* =========================================
           BÖLÜM 2: YÜKLEME EKRANI (LOADING SCREEN)
           ========================================= */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-dark);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease-in-out, visibility 1.5s;
        }

        .loader-ring {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(212, 175, 55, 0.1);
            border-top: 4px solid var(--primary-gold);
            border-radius: 50%;
            animation: spinRing 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); box-shadow: 0 0 40px rgba(212, 175, 55, 0.6); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .loader-text {
            color: var(--primary-gold);
            font-size: 1.2rem;
            letter-spacing: 3px;
            font-style: italic;
            animation: pulseText 2s infinite alternate;
        }

        @keyframes pulseText {
            0% { opacity: 0.5; text-shadow: 0 0 5px var(--primary-gold); }
            100% { opacity: 1; text-shadow: 0 0 20px var(--light-gold); }
        }

        /* =========================================
           BÖLÜM 3: ARKA PLAN VE CANVAS
           ========================================= */
        .art-background {
            position: absolute;
            top: -5%; left: -5%; width: 110%; height: 110%;
            background: linear-gradient(rgba(10, 5, 0, 0.2), rgba(20, 10, 0, 0.4)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg');
            background-size: cover;
            background-position: center 20%;
            z-index: 0;
            animation: slowPan 40s infinite alternate ease-in-out, breatheBg 8s infinite alternate ease-in-out;
        }

        #particle-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none; /* Tıklamaları engellemesin */
        }

        @keyframes slowPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-1%, -1%); }
        }

        @keyframes breatheBg {
            0% { filter: brightness(0.9) contrast(1.1) saturate(1.1); }
            100% { filter: brightness(1.2) contrast(1.2) saturate(1.3); }
        }

        /* =========================================
           BÖLÜM 4: ANA KART (3D GLASSMORPHISM)
           ========================================= */
        .card-wrapper {
            position: relative;
            z-index: 10;
            perspective: 1200px;
            transition: transform 0.2s ease-out;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 50px 35px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 92vw;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05),
                        0 20px 50px rgba(0, 0, 0, 0.8), 
                        0 0 30px rgba(212, 175, 55, 0.15);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s;
            transform-style: preserve-3d;
        }

        .card-wrapper.hide .card {
            transform: scale(0.4) translateY(150px) rotateX(45deg) !important;
            opacity: 0;
            pointer-events: none;
        }

        .card h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: var(--primary-gold);
            font-weight: 600;
            letter-spacing: 3px;
            text-shadow: 0 2px 15px rgba(212, 175, 55, 0.5);
            transform: translateZ(40px);
        }

        .card p.message {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 40px;
            color: var(--text-light);
            font-style: italic;
            transform: translateZ(25px);
        }
        
        /* Buton Grubu */
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            transform: translateZ(50px);
        }

        .btn-magic {
            padding: 14px 30px;
            background: transparent;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-magic::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .btn-magic:hover::before { left: 100%; }
        
        .btn-magic:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
            transform: translateY(-3px) scale(1.05);
            color: var(--light-gold);
        }
        
        .btn-magic:active { transform: translateY(2px) scale(0.98); }

        /* =========================================
           BÖLÜM 5: GÖZE BATAN MERKEZ BİLDİRİM (MODAL TOAST)
           ========================================= */
        #center-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 999999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
        }

        #center-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(25, 20, 15, 0.95), rgba(10, 5, 2, 0.98));
            border: 2px solid var(--primary-gold);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 85vw;
            width: 400px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.1);
            transform: scale(0.8) translateY(-50px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        #center-modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-icon {
            font-size: 50px;
            margin-bottom: 20px;
            animation: floatIcon 3s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .modal-text {
            color: var(--text-light);
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
            text-shadow: 0 2px 5px #000;
        }

        .modal-btn {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.5);
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background: var(--light-gold);
            transform: scale(1.1);
        }

        /* =========================================
           BÖLÜM 6: YENİ "MAVİ YILDIZ" (KUTUP YILDIZI)
           ========================================= */
        #hidden-blue-star {
            position: fixed;
            top: 18%; left: 15%;
            width: 40px; height: 40px;
            z-index: 45;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: breatheStar 4s infinite alternate;
        }

        /* Yıldızın CSS ile çizilmesi (Daha profesyonel görünüm) */
        .blue-star-shape {
            position: relative;
            width: 100%; height: 100%;
            background: var(--primary-blue);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 20px var(--primary-blue);
            transition: all 0.3s;
        }
        
        .blue-star-aura {
            position: absolute;
            width: 250%; height: 250%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            animation: spinAura 10s linear infinite;
        }

        @keyframes breatheStar {
            0% { transform: scale(0.6) rotate(0deg); filter: brightness(0.7); }
            100% { transform: scale(1.1) rotate(15deg); filter: brightness(1.5) drop-shadow(0 0 15px var(--primary-blue)); }
        }
        @keyframes spinAura { 100% { transform: rotate(360deg); } }

        /* =========================================
           BÖLÜM 7: KELEBEKLER, YILDIZLAR VE EFEKTLER
           ========================================= */
        
        /* Uçan Kelebekler - TIKLANABİLİRLİK ARTIRILDI */
        .butterfly {
            position: fixed;
            font-size: 45px; /* Biraz büyütüldü */
            z-index: 9999; /* En önde olacak */
            cursor: pointer;
            pointer-events: auto !important; /* Tıklamayı zorla al */
            filter: drop-shadow(0 0 10px rgba(0, 195, 255, 0.8));
            -webkit-tap-highlight-color: transparent;
            /* 3 Farklı uçuş rotası için temel ayar */
            animation-fill-mode: forwards;
            animation-timing-function: linear;
        }

        /* Rota 1: Dalgalı */
        @keyframes flyPath1 {
            0% { transform: translate3d(0, 110vh, 0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate3d(40px, 70vh, 0) rotate(15deg) scale(1.1); }
            60% { transform: translate3d(-30px, 40vh, 0) rotate(-15deg) scale(0.9); }
            90% { opacity: 1; }
            100% { transform: translate3d(20px, -20vh, 0) rotate(0deg) scale(1); opacity: 0; }
        }

        /* Rota 2: Hızlı ve Kavisli */
        @keyframes flyPath2 {
            0% { transform: translate3d(0, 110vh, 0) rotate(-20deg) scale(1); opacity: 0; }
            20% { opacity: 1; }
            50% { transform: translate3d(-60px, 50vh, 0) rotate(20deg) scale(1.2); }
            80% { transform: translate3d(50px, 10vh, 0) rotate(-10deg) scale(1); opacity: 1; }
            100% { transform: translate3d(0, -20vh, 0) rotate(0deg) scale(0.8); opacity: 0; }
        }

        /* Kayan Yıldız Efekti */
        .shooting-star-container {
            position: fixed;
            top: -100px; right: -100px;
            width: 150px; height: 150px;
            z-index: 9998;
            cursor: pointer;
            animation: starShootAnim 7s linear forwards;
            pointer-events: auto;
        }

        .shooting-star-core {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: #fff;
            box-shadow: 0 0 20px #fff, 0 0 40px var(--primary-gold);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .shooting-star-tail {
            position: absolute; top: 50%; right: 50%;
            width: 200px; height: 3px;
            background: linear-gradient(270deg, #fff, var(--primary-gold), transparent);
            transform-origin: right;
            transform: translateY(-50%) rotate(35deg);
        }

        @keyframes starShootAnim {
            0% { transform: translate(0, 0); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-140vw, 140vh); opacity: 0; }
        }

        /* Patlama Kalpleri (Emoji Particles) */
        .heart-particle {
            position: fixed;
            font-size: 28px;
            z-index: 10000;
            pointer-events: none;
            animation: popOutAnim 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        @keyframes popOutAnim {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }

        /* Su Damlası (Ripple) */
        .ripple-effect {
            position: fixed;
            border: 2px solid rgba(0, 240, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: rippleExpand 1.2s ease-out forwards;
            z-index: 40;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4) inset, 0 0 20px rgba(0, 240, 255, 0.4);
        }

        @keyframes rippleExpand {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 180px; height: 180px; opacity: 0; border-width: 0px; }
        }

        /* Fırça İzi (Klimt Brush) */
        .brush-mark {
            position: fixed;
            background: radial-gradient(circle, #ffd700 0%, #d4af37 60%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 30;
            animation: fadeBrush 1s ease-out forwards;
            mix-blend-mode: screen;
        }

        @keyframes fadeBrush {
            0% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); }
        }

        /* Zaman Kilidi (Kum Saati / Hilal) */
        #time-lock {
            position: fixed;
            bottom: 30px; right: 30px;
            font-size: 35px;
            opacity: 0.7;
            cursor: pointer;
            z-index: 90;
            transition: all 0.4s;
            animation: floatLock 4s infinite ease-in-out;
            filter: drop-shadow(0 0 15px var(--primary-gold));
        }
        #time-lock:hover { opacity: 1; transform: scale(1.2); }

        @keyframes floatLock {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Final Büyülü Yazı Konteyneri */
        #magic-text-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #giant-name {
            font-family: 'Great Vibes', cursive; font-size: 7rem;
            color: var(--primary-gold);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8), 0 0 10px #fff;
            opacity: 0; transform: scale(0.5); transition: all 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #giant-name.show { opacity: 1; transform: scale(1); }
        
        #typewriter-text {
            margin-top: 30px; font-size: 1.5rem; color: #fff;
            text-align: center; max-width: 85%; min-height: 90px;
            font-style: italic; text-shadow: 0 4px 15px rgba(0,0,0,0.9);
            line-height: 1.5;
        }
        .cursor-blink {
            display: inline-block; width: 3px; height: 1.3rem;
            background-color: var(--primary-gold); margin-left: 5px;
            animation: blinker 0.8s infinite; vertical-align: middle;
        }
        @keyframes blinker { 50% { opacity: 0; } }

    </style>
</head>
<body>

    <!-- Yükleme Ekranı -->
    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div class="loader-text">Damla'nın dünyasına bağlanılıyor...</div>
    </div>

    <!-- Dinamik Müzik -->
    <audio id="bg-audio" loop>
        <source id="audio-src" src="" type="audio/mpeg">
    </audio>

    <!-- Arka Plan ve Yapay Zeka Yıldız Ağı (Canvas) -->
    <div class="art-background" id="parallax-bg"></div>
    <canvas id="particle-canvas"></canvas>
    
    <!-- Yeni Gizli Mavi Yıldız -->
    <div id="hidden-blue-star">
        <div class="blue-star-aura"></div>
        <div class="blue-star-shape"></div>
    </div>

    <!-- Zaman Kilidi -->
    <div id="time-lock">⏳</div>

    <!-- Final Animasyon Alanı -->
    <div id="magic-text-container">
        <div id="giant-name">Damla</div>
        <div id="typewriter-text"></div>
    </div>

    <!-- Ana 3D Kart -->
    <div class="card-wrapper" id="main-card">
        <div class="card">
            <h1>Merhaba Damla</h1>
            <p class="message">Ekranda uçuşan mavi kelebeklerden birini yakalamayı dene...</p>
            
            <div class="button-group">
                <button class="btn-magic" data-msg="1">İyi</button>
                <button class="btn-magic" data-msg="2">Çok İyi</button>
            </div>
        </div>
    </div>

    <!-- GÖZE BATAN MERKEZ BİLDİRİM (MODAL) -->
    <div id="center-modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">✨</div>
            <div class="modal-text" id="modal-text">Mesaj buraya gelecek...</div>
            <button class="modal-btn" id="modal-close-btn">Tamam</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           BÖLÜM 1: GENEL AYARLAR VE YAPILANDIRMA (CONFIG)
           Bu alan tüm sistemin kalbidir. Süreler, metinler buradan yönetilir.
           ========================================================================== */
        const CONFIG = {
            texts: {
                msg1: "Klimt bu tabloyu çizerken dünyanın en güzel altın sarısını kullandı... Ama sanırım o mavi bakışlarına hiç denk gelmemişti.",
                msg2: "Tarihin en ünlü eserleri altın yaldızlarla işlenmiş olabilir, ama bence o mavi gözlerin hiçbir tabloya sığmayacak kadar güzel..."
            },
            audio: {
                aksam: "sarki_aksam.mp3",   // 19:00 - 01:00
                gece: "sarki_gece.mp3",     // 01:00 - 14:00
                gunduz: "sarki_gunduz.mp3"  // 14:00 - 19:00
            },
            timings: {
                butterflySpawnRate: 1800, // Kelebek çıkma hızı (ms)
                shootingStarRate: 12000,  // Kayan yıldız sıklığı (ms)
                longPressDuration: 2500,  // Kalp atışı için basılı tutma (ms)
                typewriterSpeed: 50       // Daktilo harf yazma hızı (ms)
            },
            particles: {
                canvasStarCount: 80,      // Arka plan birbirine bağlanan yıldız sayısı
                connectionDistance: 120   // Yıldızların birbirine bağlanma mesafesi
            }
        };

        // DOM Elementleri
        const els = {
            loading: document.getElementById('loading-screen'),
            audio: document.getElementById('bg-audio'),
            audioSrc: document.getElementById('audio-src'),
            cardWrap: document.getElementById('main-card'),
            bg: document.getElementById('parallax-bg'),
            modal: document.getElementById('center-modal'),
            modalIcon: document.getElementById('modal-icon'),
            modalText: document.getElementById('modal-text'),
            modalBtn: document.getElementById('modal-close-btn'),
            timeLock: document.getElementById('time-lock'),
            blueStar: document.getElementById('hidden-blue-star'),
            giantName: document.getElementById('giant-name'),
            typewriter: document.getElementById('typewriter-text'),
            canvas: document.getElementById('particle-canvas')
        };

        let isAppActive = false; // Büyü animasyonu devrede mi?
        let starCatchCount = 0; // Kayan yıldız yakalama sayacı

        /* ==========================================================================
           BÖLÜM 2: BAŞLANGIÇ YÜKLEME EKRANI & ZAMANLANMIŞ MÜZİK
           ========================================================================== */
        window.addEventListener('load', () => {
            setMusicByTime();
            // Yükleme ekranını 2 saniye sonra zarifçe kaldır
            setTimeout(() => {
                els.loading.style.opacity = '0';
                setTimeout(() => {
                    els.loading.style.display = 'none';
                    initCanvasParticles(); // Canvas'ı başlat
                }, 1500);
            }, 2000);
        });

        function setMusicByTime() {
            const hour = new Date().getHours();
            if (hour >= 19 || hour < 1) {
                els.audioSrc.src = CONFIG.audio.aksam;
            } else if (hour >= 1 && hour < 14) {
                els.audioSrc.src = CONFIG.audio.gece;
            } else {
                els.audioSrc.src = CONFIG.audio.gunduz;
            }
            els.audio.load();
        }

        function forcePlayMusic() {
            if (els.audio.paused) {
                els.audio.play().catch(e => console.log("Kullanıcı etkileşimi bekleniyor..."));
            }
        }

        /* ==========================================================================
           BÖLÜM 3: MERKEZİ BİLDİRİM SİSTEMİ (DEV MODAL)
           ========================================================================== */
        let autoCloseModalTimer;

        function showBigNotification(icon, message, duration = 6000) {
            clearTimeout(autoCloseModalTimer);
            els.modalIcon.innerHTML = icon;
            els.modalText.innerHTML = message;
            els.modal.classList.add('active');

            // Belirtilen süre sonunda otomatik kapat
            autoCloseModalTimer = setTimeout(() => {
                closeModal();
            }, duration);
        }

        function closeModal() {
            els.modal.classList.remove('active');
        }

        els.modalBtn.addEventListener('click', () => {
            clearTimeout(autoCloseModalTimer);
            closeModal();
        });

        /* ==========================================================================
           BÖLÜM 4: ZAMAN KİLİDİ (KUM SAATİ / HİLAL)
           ========================================================================== */
        function checkTimeStatus() {
            const hour = new Date().getHours();
            if (hour >= 19 || hour < 6) {
                els.timeLock.innerHTML = '🌙';
            } else {
                els.timeLock.innerHTML = '⏳';
            }
        }
        setInterval(checkTimeStatus, 60000);
        checkTimeStatus();

        els.timeLock.addEventListener('click', (e) => {
            e.stopPropagation();
            const hour = new Date().getHours();
            if (hour >= 19 || hour < 6) {
                showBigNotification('🌙', "Bu gece o mavi gözlerin her zamankinden daha güzel parlıyor...", 7000);
            } else {
                showBigNotification('⏳', "Güneşin batmasını bekle, asıl sürpriz akşam 7'den sonra başlıyor...", 6000);
            }
        });

        /* ==========================================================================
           BÖLÜM 5: GİZLİ MAVİ YILDIZ & MELEK SAATLERİ (EASTER EGGS)
           ========================================================================== */
        els.blueStar.addEventListener('click', (e) => {
            e.stopPropagation();
            els.blueStar.style.display = 'none'; // Sadece 1 kez bulunabilir
            forcePlayMusic();
            explodeHearts(e.clientX, e.clientY, false); // Mavi kalpler patlasın
            showBigNotification('💙', "Milyonlarca yıldız arasında sadece biri maviydi... Tıpkı o gözler gibi.", 8000);
        });

        // 11:11, 22:22 Kontrolü
        setInterval(() => {
            const d = new Date();
            const h = d.getHours();
            const m = d.getMinutes();
            if ((h === 11 && m === 11) || (h === 22 && m === 22) || (h === 0 && m === 0)) {
                showBigNotification('✨', `Saat şu an ${h}:${m < 10 ? '0'+m : m}... Acaba aklından ne geçiyordu?`, 8000);
            }
        }, 60000);

        /* ==========================================================================
           BÖLÜM 6: GELİŞMİŞ ETKİLEŞİMLER (SU DAMLASI, FIRÇA, UZUN BASMA)
           ========================================================================== */
        let pressTimer;
        let isDrawing = false;

        // Dokunma Başlangıcı
        function onPointerDown(e) {
            if(e.target.closest('#center-modal') || e.target.closest('button') || e.target.classList.contains('butterfly')) return;
            
            isDrawing = true;
            let x = e.clientX || (e.touches && e.touches[0].clientX);
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            
            spawnRipple(x, y);

            // Uzun basma sayacı (Kalp atışı titreşimi)
            pressTimer = setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate([100, 100, 100]); 
                showBigNotification('🫀', "İşte tam olarak bu kadar özelsin...", 6000);
                els.bg.style.filter = "brightness(0.3) grayscale(0.5)"; 
                setTimeout(() => els.bg.style.filter = "", 2500);
            }, CONFIG.timings.longPressDuration);
        }

        // Dokunma Bitişi
        function onPointerUp() {
            clearTimeout(pressTimer);
            isDrawing = false;
        }

        // Fırça İzi (Hareket)
        function onPointerMove(e) {
            if (!isDrawing) return;
            clearTimeout(pressTimer); // Hareket ederse uzun basma iptal
            
            let x = e.clientX || (e.touches && e.touches[0].clientX);
            let y = e.clientY || (e.touches && e.touches[0].clientY);
            
            const brush = document.createElement('div');
            brush.className = 'brush-mark';
            brush.style.left = x + 'px';
            brush.style.top = y + 'px';
            
            // Fırça boyutunu rastgele yap
            const size = Math.random() * 15 + 5;
            brush.style.width = size + 'px';
            brush.style.height = size + 'px';
            
            document.body.appendChild(brush);
            setTimeout(() => brush.remove(), 1000);
        }

        document.addEventListener('mousedown', onPointerDown);
        document.addEventListener('mouseup', onPointerUp);
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('touchstart', onPointerDown, {passive: false});
        document.addEventListener('touchend', onPointerUp);
        document.addEventListener('touchmove', onPointerMove, {passive: false});

        function spawnRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            ripple.style.left = x + 'px'; 
            ripple.style.top = y + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1200);
        }

        /* ==========================================================================
           BÖLÜM 7: JİROSKOP & FARE 3D PARALLAX MOTORU
           ========================================================================== */
        window.addEventListener('deviceorientation', (e) => {
            if (!e.gamma || !e.beta) return;
            // Eğimleri sınırlandır (Motion sickness engellemek için)
            const tiltX = Math.min(Math.max(e.gamma, -25), 25);
            const tiltY = Math.min(Math.max(e.beta - 45, -25), 25);
            
            els.bg.style.transform = `translate3d(${tiltX * 1.5}px, ${tiltY * 1.5}px, 0) scale(1.1)`;
            els.cardWrap.style.transform = `translate3d(${-tiltX}px, ${-tiltY}px, 0) rotateY(${tiltX * 0.5}deg) rotateX(${-tiltY * 0.5}deg)`;
        });

        document.addEventListener('mousemove', (e) => {
            const moveX = (window.innerWidth / 2 - e.pageX) / 40;
            const moveY = (window.innerHeight / 2 - e.pageY) / 40;
            els.bg.style.transform = `translate3d(${-moveX * 1.5}px, ${-moveY * 1.5}px, 0) scale(1.1)`;
            els.cardWrap.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) rotateY(${moveX * 0.8}deg) rotateX(${-moveY * 0.8}deg)`;
        });

        /* ==========================================================================
           BÖLÜM 8: YAKALANABİLİR KELEBEKLER & YILDIZLAR (Tıklama Düzeltildi)
           ========================================================================== */
        
        // --- 10 Saniyede Bir Kayan Yıldız ---
        setInterval(() => {
            if (isAppActive) return; // Final animasyondayken çıkmasın
            
            const star = document.createElement('div');
            star.className = 'shooting-star-container';
            star.innerHTML = `<div class="shooting-star-core"></div><div class="shooting-star-tail"></div>`;
            
            // Pointerdown (tüm cihazlarda kusursuz tık)
            star.addEventListener('pointerdown', (e) => {
                e.stopPropagation(); e.preventDefault();
                star.remove();
                starCatchCount++;
                forcePlayMusic();
                
                let x = e.clientX || (e.touches && e.touches[0].clientX);
                let y = e.clientY || (e.touches && e.touches[0].clientY);
                explodeHearts(x, y, true); // Altın yıldızlar saç

                if (starCatchCount === 1) {
                    showBigNotification('🌠', "Hemen içinden bir dilek tut...", 6000);
                } else {
                    showBigNotification('✨', "Kim bilir, belki de o tuttuğun dilek çoktan kabul olmuştur...", 7000);
                }
            });

            document.body.appendChild(star);
            setTimeout(() => { if (document.body.contains(star)) star.remove(); }, 7500);
        }, CONFIG.timings.shootingStarRate);

        // --- Sürekli Çıkan Kelebekler ---
        setInterval(() => {
            if (isAppActive) return;
            
            const b = document.createElement('div');
            b.innerHTML = '🦋';
            b.className = 'butterfly';
            
            // Rastgele başlangıç ve animasyon rotası
            b.style.left = (Math.random() * 80 + 10) + 'vw'; // Kenarlara çok yapışmasın
            const duration = Math.random() * 4 + 5; // 5-9 saniye arası
            b.style.animationDuration = duration + 's';
            
            // 2 farklı animasyon path'inden birini seç
            b.style.animationName = Math.random() > 0.5 ? 'flyPath1' : 'flyPath2';

            // KUSURSUZ TIKLAMA YAKALAYICI
            b.addEventListener('pointerdown', (e) => {
                e.preventDefault(); 
                e.stopPropagation();
                
                b.remove(); // Tıklanır tıklanmaz yok et
                forcePlayMusic();
                
                let x = e.clientX || (e.touches && e.touches[0].clientX);
                let y = e.clientY || (e.touches && e.touches[0].clientY);
                explodeHearts(x, y, false); // Mavi/Sarı kalpler saç
            });

            document.body.appendChild(b);
            setTimeout(() => { if (document.body.contains(b)) b.remove(); }, duration * 1000);
        }, CONFIG.timings.butterflySpawnRate);

        // Emoji Partikül Patlaması (Kalpler veya Yıldızlar)
        function explodeHearts(x, y, isGoldMode = false) {
            const emojis = isGoldMode ? ['✨', '⭐', '🌟', '💫'] : ['💙', '💛', '💖', '🦋']; 
            const particleCount = isGoldMode ? 12 : 8; // Yıldızda daha çok çıksın
            
            for(let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                p.className = 'heart-particle';
                p.style.left = x + 'px'; 
                p.style.top = y + 'px';
                
                // Matematiksel Rastgele Saçılma Yönleri
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 150 + 100;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                const rot = (Math.random() - 0.5) * 360; 
                
                p.style.setProperty('--tx', `${tx}px`);
                p.style.setProperty('--ty', `${ty}px`);
                p.style.setProperty('--rot', `${rot}deg`);
                
                document.body.appendChild(p);
                setTimeout(() => { if(document.body.contains(p)) p.remove(); }, 1000);
            }
        }

        /* ==========================================================================
           BÖLÜM 9: ANA HİKAYE & BÜYÜLÜ DAKTİLO (BUTONLARA BASINCA)
           ========================================================================== */
        document.querySelectorAll('.btn-magic').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const msgType = btn.getAttribute('data-msg');
                startFinalMagic(msgType);
            });
        });

        function typeWriterEffect(text, index, element, callback) {
            if (index === 0) element.innerHTML = '<span class="cursor-blink"></span>';
            
            if (index < text.length) {
                // Harfi ekle ve cursor'ı sona taşı
                element.innerHTML = text.substring(0, index + 1) + '<span class="cursor-blink"></span>';
                setTimeout(() => typeWriterEffect(text, index + 1, element, callback), CONFIG.timings.typewriterSpeed); 
            } else {
                if(callback) callback();
            }
        }

        function startFinalMagic(type) {
            if(isAppActive) return;
            isAppActive = true;
            forcePlayMusic();

            // Tüm yan öğeleri gizle
            els.cardWrap.classList.add('hide');
            els.timeLock.style.display = 'none';
            els.blueStar.style.display = 'none';
            els.typewriter.innerHTML = '';
            
            // Arka planı dramatikleştir
            els.bg.style.filter = "brightness(0.5)";
            
            // İsim Çıksın
            setTimeout(() => {
                els.giantName.classList.add('show');
                
                // Mesaj Yazılmaya Başlasın
                setTimeout(() => {
                    const message = type == "1" ? CONFIG.texts.msg1 : CONFIG.texts.msg2;
                    typeWriterEffect(message, 0, els.typewriter, () => {
                        // Yazı bittikten 8 saniye sonra sistemi sıfırla
                        setTimeout(resetMagic, 8000);
                    });
                }, 1500);
            }, 600);
        }

        function resetMagic() {
            els.giantName.classList.remove('show');
            els.typewriter.innerHTML = '';
            els.bg.style.filter = ""; // Arka plan normal
            
            setTimeout(() => {
                els.cardWrap.classList.remove('hide');
                els.timeLock.style.display = 'block';
                isAppActive = false;
            }, 2000);
        }

        /* ==========================================================================
           BÖLÜM 10: HTML5 CANVAS TAKIMYILDIZI (CONSTELLATION) MOTORU
           Bu kısım siteye ultra premium, mühendislik harikası bir görünüm katar.
           ========================================================================== */
        function initCanvasParticles() {
            const ctx = els.canvas.getContext('2d');
            let particles = [];
            
            // Ekran boyutunu güncelle
            function resizeCanvas() {
                els.canvas.width = window.innerWidth;
                els.canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Parçacık Sınıfı (OOP)
            class Particle {
                constructor() {
                    this.x = Math.random() * els.canvas.width;
                    this.y = Math.random() * els.canvas.height;
                    this.vx = (Math.random() - 0.5) * 0.5; // Çok yavaş hareket
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.radius = Math.random() * 2 + 0.5;
                    this.baseAlpha = Math.random() * 0.5 + 0.1;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    // Ekrandan çıkarsa diğer taraftan sok
                    if (this.x < 0) this.x = els.canvas.width;
                    if (this.x > els.canvas.width) this.x = 0;
                    if (this.y < 0) this.y = els.canvas.height;
                    if (this.y > els.canvas.height) this.y = 0;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(212, 175, 55, ${this.baseAlpha})`; // Altın rengi yıldızlar
                    ctx.fill();
                }
            }

            // Parçacıkları oluştur
            for (let i = 0; i < CONFIG.particles.canvasStarCount; i++) {
                particles.push(new Particle());
            }

            // Fare koordinatları
            let mouse = { x: null, y: null };
            window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
            window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
            window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive: true});
            window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

            // Animasyon Döngüsü
            function animateCanvas() {
                ctx.clearRect(0, 0, els.canvas.width, els.canvas.height);
                
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                    
                    // Parçacıkları birbirine bağla
                    for (let j = i; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < CONFIG.particles.connectionDistance) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(212, 175, 55, ${0.2 - distance/CONFIG.particles.connectionDistance})`;
                            ctx.lineWidth = 0.5;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                    
                    // Parçacıkları fareye bağla (Sihirli ağ etkisi)
                    if (mouse.x != null) {
                        const dx = particles[i].x - mouse.x;
                        const dy = particles[i].y - mouse.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 150) {
                            ctx.beginPath();
                            ctx.strokeStyle = `rgba(0, 240, 255, ${0.4 - distance/150})`; // Fareye mavi bağ
                            ctx.lineWidth = 1;
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                            
                            // Fareye yaklaşan yıldızları hafifçe it (manyetik etki)
                            particles[i].x += dx * 0.005;
                            particles[i].y += dy * 0.005;
                        }
                    }
                }
                requestAnimationFrame(animateCanvas);
            }
            animateCanvas(); // Motoru çalıştır
        }
    </script>
</body>
</html>
