<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merhaba Damla</title>
    <!-- Sanatsal ve zarif yazı tipleri -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif; }

        body {
            background-color: #0c0804;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            color: #fff;
            perspective: 1000px;
            touch-action: manipulation;
        }

        /* 1. YENİLİK: Nefes Alan ve Yakınlaşan Tablo */
        .art-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(12, 8, 4, 0.7), rgba(26, 17, 5, 0.85)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg');
            background-size: cover; background-position: center 20%;
            z-index: 0;
            /* Hem hareket eder hem de parlaklığı azalıp artarak nefes alır */
            animation: slowPan 30s infinite alternate ease-in-out, breathe 5s infinite alternate ease-in-out;
        }

        @keyframes slowPan {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        @keyframes breathe {
            0% { filter: brightness(0.8) contrast(1.1); }
            100% { filter: brightness(1.2) contrast(1.2); }
        }

        /* Ana Kart */
        .card-wrapper { position: relative; z-index: 10; perspective: 1000px; }

        .card {
            background: rgba(20, 15, 10, 0.65); backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 45px 30px; border-radius: 12px; text-align: center;
            max-width: 420px; width: 90vw;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(212, 175, 55, 0.15);
            transition: transform 0.1s ease, opacity 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .card-wrapper.hide .card {
            transform: scale(0.6) translateY(80px) rotateX(30deg) !important;
            opacity: 0; pointer-events: none;
        }

        h1 {
            font-size: 28px; margin-bottom: 15px; color: #d4af37;
            font-weight: 600; letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }

        p.message {
            font-size: 15px; line-height: 1.7; margin-bottom: 35px;
            color: #e8dcc4; font-style: italic;
        }

        /* Butonlar */
        .button-group { display: flex; gap: 15px; justify-content: center; }

        button {
            padding: 12px 25px; background: transparent;
            border: 1px solid #d4af37; color: #d4af37;
            border-radius: 4px; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.4s ease;
            position: relative; overflow: hidden;
        }

        button:active { transform: translateY(2px); }

        /* Dev İsim & Mesaj */
        #magic-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        #big-name {
            font-family: 'Great Vibes', cursive; font-size: 6rem; color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
            opacity: 0; transform: scale(0.85); transition: all 1.8s ease;
        }
        #big-name.show { opacity: 1; transform: scale(1); }

        #final-message {
            margin-top: 25px; font-size: 1.2rem; color: #fdf5e6;
            text-align: center; max-width: 90%; min-height: 80px; font-style: italic;
        }

        /* 2. YENİLİK: Su Damlası (Ripple) Efekti */
        .ripple {
            position: fixed;
            border: 2px solid rgba(0, 195, 255, 0.5); /* Mavi göz rengi */
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: rippleAnim 1s ease-out forwards;
            z-index: 15;
            box-shadow: 0 0 10px rgba(0, 195, 255, 0.3) inset;
        }

        @keyframes rippleAnim {
            0% { width: 0; height: 0; opacity: 1; border-width: 3px; }
            100% { width: 120px; height: 120px; opacity: 0; border-width: 1px; }
        }

        /* 3. YENİLİK: Zaman Kilitli Sır Kutu */
        #secret-lock {
            position: fixed; bottom: 25px; right: 25px;
            font-size: 24px; opacity: 0.4; cursor: pointer; z-index: 50;
            transition: all 0.3s; animation: pulseLock 2s infinite;
            -webkit-tap-highlight-color: transparent;
        }
        #secret-lock:hover, #secret-lock:active { opacity: 1; transform: scale(1.2); }
        
        @keyframes pulseLock {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Zarif Uyarı / Bildirim Ekranı (Toast) */
        #custom-toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 15, 10, 0.95); border: 1px solid #d4af37;
            color: #d4af37; padding: 12px 25px; border-radius: 30px;
            font-size: 14px; font-style: italic; z-index: 1000;
            transition: bottom 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 5px 20px rgba(0,0,0,0.7); text-align: center;
            width: max-content; max-width: 90vw;
        }
        #custom-toast.show { bottom: 40px; }

   /* 4. YENİLİK: Kayan Yıldız Efekti */
        .interactive-star {
            position: fixed; top: -50px; right: -50px;
            width: 80px; height: 80px; z-index: 200; cursor: pointer;
            /* Süreyi 2.5 saniyeden 8 saniyeye çıkardık (Çok daha yavaş kaysın diye) */
            animation: starShoot 8s linear forwards;
            -webkit-tap-highlight-color: transparent;
        }
        .interactive-star::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: #fff;
            box-shadow: 0 0 15px #fff, 0 0 30px #d4af37; border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .interactive-star::before {
            content: ''; position: absolute; top: 50%; right: 50%;
            width: 120px; height: 2px;
            background: linear-gradient(270deg, rgba(212, 175, 55, 1), transparent);
            transform-origin: right; transform: translateY(-50%) rotate(25deg);
        }

        @keyframes starShoot {
            0% { transform: translate(0, 0); opacity: 1; }
            85% { opacity: 1; } /* Yıldız ekranda daha uzun süre parlak kalır */
            100% { transform: translate(-120vw, 120vh); opacity: 0; }
        }
        /* Uçan Kelebekler ve Kalpler */
        .butterfly {
            position: fixed; font-size: 35px; z-index: 50; cursor: pointer;
            animation: flyUp linear forwards; filter: drop-shadow(0 0 8px rgba(0, 195, 255, 0.6));
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes flyUp {
            0% { transform: translateY(110vh) rotate(0deg) scale(1); opacity: 1; }
            50% { transform: translateY(40vh) translateX(-20px) rotate(-10deg) scale(1); }
            100% { transform: translateY(-20vh) rotate(0deg) scale(1); opacity: 0; }
        }

        .heart-pop {
            position: fixed; font-size: 24px; z-index: 60;
            pointer-events: none; animation: popOut 1s ease-out forwards;
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Müzik -->
    <audio id="bg-music" loop>
        <source src="billabong.mp3" type="audio/mpeg">
    </audio>

    <div class="art-background"></div>

    <div id="magic-container">
        <div id="big-name">Damla</div>
        <div id="final-message"></div>
    </div>

    <!-- Gizli Saat Kilidi -->
    <div id="secret-lock" onclick="checkTimeSecret(event)">🔒</div>

    <!-- Bildirim Ekranı -->
    <div id="custom-toast"></div>

    <div class="card-wrapper" id="main-card-wrapper">
        <div class="card" id="card">
            <h1>Merhaba Damla</h1>
            <p class="message">Ekranda uçuşan mavi kelebeklerden birini yakalamayı dene...</p>
            
            <div class="button-group">
                <button onclick="triggerMagic(1, event)">İyi</button>
                <button onclick="triggerMagic(2, event)">Çok İyi</button>
            </div>
        </div>
    </div>

    <script>
        const messages = {
            1: "Klimt bu tabloyu çizerken dünyanın en güzel altın sarısını kullandı... Ama sanırım o mavi bakışlarına hiç denk gelmemişti.",
            2: "Tarihin en ünlü eserleri altın yaldızlarla işlenmiş olabilir, ama bence o mavi gözlerin hiçbir tabloya sığmayacak kadar güzel..."
        };

        // --- Ortak Toast (Bildirim) Fonksiyonu ---
        let toastTimeout;
        function showToast(msg, duration = 3000) {
            const toast = document.getElementById('custom-toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, duration);
        }

        // --- Su Damlası (Ripple) Efekti ---
        function createRipple(e) {
            const ripple = document.createElement('div');
            ripple.classList.add('ripple');
            
            let x, y;
            if (e.type === 'touchstart' || e.type === 'touchmove') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }

            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            document.body.appendChild(ripple);
            
            setTimeout(() => { ripple.remove(); }, 1000);
        }
        
        // Ekrana her dokunduğunda damla efekti çıksın
        document.addEventListener('mousedown', createRipple);
        document.addEventListener('touchstart', createRipple, {passive: true});

        // --- Zaman Kilitli Sır (Gece 00:00 Şartı) ---
        function checkTimeSecret(e) {
            e.stopPropagation(); // Damla efektini ezmesin diye
            const hour = new Date().getHours();
            
            // Gece 00:00 ile Sabah 06:00 arası açılır
            if (hour === 0 || hour < 6) {
                showToast("Bugün o mavi gözlerin yeterince yoruldu, tatlı rüyalar... 💙", 4500);
            } else {
                showToast("Biraz sabırsızız galiba :) Doğru zamanı (00:00) bekle... ⏳", 3500);
            }
        }

        // --- Kayan Yıldız (5-6 Saniye Sonra Çıkar) ---
        setTimeout(() => {
            const star = document.createElement('div');
            star.className = 'interactive-star';
            
           // Yıldıza tıklandığında
            const catchStar = (e) => {
                e.stopPropagation();
                star.remove();
                
                // Mesaj güncellendi ve ekranda kalma süresi 7000 milisaniye (7 saniye) yapıldı
                showToast("Kayan yıldızı yakaladın! Kim bilir, belki de tuttuğun dilek çoktan gerçekleşmiştir... ✨", 7000);
                
                playMusic(); // Şarkıyı başlatır
                // Dokunulan yerde yıldız patlaması
                createHearts(e.clientX || e.touches[0].clientX, e.clientY || e.touches[0].clientY, true);
            };

            star.addEventListener('touchstart', catchStar, {passive: false});
            star.addEventListener('mousedown', catchStar);
            document.body.appendChild(star);

            // Çıkmadan hemen önce ipucu ver
            showToast("Hızlı ol, kayan yıldıza dokun! 🌠", 2500);
        }, 5500); // 5.5 saniye sonra tetiklenir


        // --- Kelebek ve Müzik Kodları (Eski Kodların Aynısı) ---
        function playMusic() {
            const music = document.getElementById('bg-music');
            if (music.paused) music.play().catch(e => console.log("Otomatik oynatma engeli."));
        }

        setInterval(spawnButterfly, 1500);

        function spawnButterfly() {
            const b = document.createElement('div');
            b.innerHTML = '🦋';
            b.className = 'butterfly';
            b.style.left = Math.random() * 85 + 'vw';
            b.style.animationDuration = (Math.random() * 4 + 4) + 's'; 
            
            b.addEventListener('touchstart', (e) => catchButterfly(e, b), { passive: false });
            b.addEventListener('mousedown', (e) => catchButterfly(e, b));
            
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 9000); 
        }

        function catchButterfly(e, butterflyElement) {
            e.preventDefault();
            e.stopPropagation(); // Arkadaki damla efektini durdurur
            playMusic(); 

            let x = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
            let y = (e.type === 'touchstart') ? e.touches[0].clientY : e.clientY;

            butterflyElement.remove();
            createHearts(x, y);
        }

        function createHearts(x, y, isGold = false) {
            // Eğer yıldızdan geliyorsa altın/beyaz yıldızlar atsın, kelebekten geliyorsa mavi kalpler
            const heartColors = isGold ? ['✨', '⭐', '🌟'] : ['💙', '💛', '💖', '💙']; 
            
            for(let i = 0; i < 8; i++) {
                const h = document.createElement('div');
                h.innerHTML = heartColors[Math.floor(Math.random() * heartColors.length)];
                h.className = 'heart-pop';
                h.style.left = x + 'px';
                h.style.top = y + 'px';
                
                const tx = (Math.random() - 0.5) * 200; 
                const ty = (Math.random() - 1) * 200;   
                const rot = (Math.random() - 0.5) * 180; 
                
                h.style.setProperty('--tx', `${tx}px`);
                h.style.setProperty('--ty', `${ty}px`);
                h.style.setProperty('--rot', `${rot}deg`);
                
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1000);
            }
        }

        let isAnimating = false;
        function typeWriter(text, i, elementId) {
            if (i < text.length) {
                document.getElementById(elementId).innerHTML = text.substring(0, i + 1);
                setTimeout(() => typeWriter(text, i + 1, elementId), 45); 
            }
        }

        function triggerMagic(type, e) {
            e.stopPropagation();
            if(isAnimating) return;
            isAnimating = true;
            playMusic();

            const cardWrapper = document.getElementById('main-card-wrapper');
            const bigName = document.getElementById('big-name');
            const finalMessage = document.getElementById('final-message');
            
            cardWrapper.classList.add('hide');
            finalMessage.innerHTML = '';

            setTimeout(() => {
                bigName.classList.add('show');
                setTimeout(() => {
                    typeWriter(messages[type], 0, 'final-message');
                }, 1200);
            }, 600);

            setTimeout(() => {
                bigName.classList.remove('show');
                finalMessage.innerHTML = '';
                setTimeout(() => {
                    cardWrapper.classList.remove('hide');
                    isAnimating = false;
                }, 1500);
            }, 12000);
        }
    </script>
</body>
</html>
