<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050301">
    <title>Damla İçin Eşsiz Bir Şaheser</title>
    
    <!-- Sanatsal yazı tipleri -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           BÖLÜM 1: MERKEZİ TASARIM SİSTEMİ (CSS DEĞİŞKENLERİ)
           ========================================================================== */
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f9f1cc;
            --gold-dark: #8a7322;
            --blue-primary: #00f0ff; /* Damla yazısı için ana mavi */
            --bg-dark: #050301;
            --glass-bg: rgba(15, 10, 5, 0.55);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-light: #fdf5e6;
            
            /* Z-Index Hiyerarşisi */
            --z-bg: 0;
            --z-canvas: 1;
            --z-particles: 5;
            --z-card: 10;
            --z-interactions: 20;
            --z-butterflies: 50;
            --z-shooting-stars: 200;
            --z-toast: 1000;
            --z-overlay: 50000;
            --z-loading: 99999;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Playfair Display', serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #fff; perspective: 1200px; touch-action: none; user-select: none; -webkit-user-select: none; }

        /* ==========================================================================
           BÖLÜM 2: YÜKLEME VE BAŞLANGIÇ EKRANLARI (MÜZİK/JİROSKOP İZNİ İÇİN)
           ========================================================================== */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--bg-dark); z-index: var(--z-loading);
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease-in-out;
        }
        .loader-ring { width: 80px; height: 80px; border: 4px solid rgba(212, 175, 55, 0.1); border-top: 4px solid var(--gold-primary); border-radius: 50%; animation: spinRing 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; margin-bottom: 30px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.6); }
        @keyframes spinRing { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); box-shadow: 0 0 40px var(--gold-primary); } 100% { transform: rotate(360deg) scale(1); } }
        .loader-text { color: var(--gold-primary); font-size: 1.2rem; letter-spacing: 4px; font-style: italic; animation: pulseText 2s infinite alternate; }
        @keyframes pulseText { 0% { opacity: 0.5; text-shadow: 0 0 5px var(--gold-primary); } 100% { opacity: 1; text-shadow: 0 0 20px var(--gold-light); } }

        /* Büyüyü Başlat Ekranı (Sensör ve Ses Onayı İçin Zorunlu) */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 3, 1, 0.9); backdrop-filter: blur(15px);
            z-index: var(--z-overlay); display: none; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s;
        }
        .start-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(138, 115, 34, 0.4)); border: 2px solid var(--gold-primary);
            color: var(--gold-light); padding: 20px 40px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); animation: pulseStartBtn 2s infinite alternate; transition: transform 0.3s;
        }
        .start-btn:active { transform: scale(0.95); }
        @keyframes pulseStartBtn { 0% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); } 100% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.8), inset 0 0 20px rgba(212, 175, 55, 0.5); } }

        /* ==========================================================================
           BÖLÜM 3: PARALLAX ARKA PLAN VE CANVAS
           ========================================================================== */
        .art-background {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            background: linear-gradient(rgba(20, 10, 0, 0.15), rgba(30, 15, 0, 0.35)), url('https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg');
            background-size: cover; background-position: center 20%; z-index: var(--z-bg);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: breatheBg 8s infinite alternate ease-in-out;
        }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: var(--z-canvas); pointer-events: none; }
        @keyframes breatheBg { 0% { filter: brightness(0.95) contrast(1.1) saturate(1.1); } 100% { filter: brightness(1.25) contrast(1.2) saturate(1.2); } }

        /* ==========================================================================
           BÖLÜM 4: ANA KART (3D GLASSMORPHISM ARAYÜZÜ)
           ========================================================================== */
        .card-wrapper {
            position: relative; z-index: var(--z-card); perspective: 1200px;
            transition: transform 0.1s ease-out; /* Jiroskop akıcılığı için kısa süre */
        }
        .card {
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); padding: 50px 35px; border-radius: 24px; text-align: center;
            max-width: 450px; width: 92vw; box-shadow: inset 0 0 30px rgba(255,255,255,0.03), 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.15);
            transition: opacity 0.8s; transform-style: preserve-3d;
        }
        .card-wrapper.hide .card { opacity: 0; pointer-events: none; }
        .card h1 { font-size: 34px; margin-bottom: 15px; color: var(--gold-primary); font-weight: 700; letter-spacing: 3px; text-shadow: 0 4px 15px rgba(212, 175, 55, 0.6); transform: translateZ(40px); }
        .card p.message { font-size: 16px; line-height: 1.8; margin-bottom: 35px; color: var(--text-light); font-style: italic; transform: translateZ(25px); }
        
        .button-group { display: flex; gap: 15px; justify-content: center; transform: translateZ(50px); }
        .btn-magic {
            padding: 14px 35px; background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-primary);
            border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.4s ease; position: relative; overflow: hidden; z-index: 1; flex: 1;
        }
        .btn-magic::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent); transition: left 0.5s ease; z-index: -1; }
        .btn-magic:hover::before { left: 100%; }
        .btn-magic:hover { background: rgba(212, 175, 55, 0.15); box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3); transform: translateY(-3px) scale(1.05); color: var(--gold-light); }
        .btn-magic:active { transform: translateY(2px) scale(0.98); }

        /* ==========================================================================
           BÖLÜM 5: MERKEZİ BİLDİRİM EKRANI (GÖZE BATAN MODAL)
           ========================================================================== */
        #center-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(10px);
            z-index: var(--z-toast); display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.4s, visibility 0.4s;
        }
        #center-modal.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: linear-gradient(135deg, rgba(25, 20, 15, 0.95), rgba(10, 5, 2, 0.98)); border: 2px solid var(--gold-primary); border-radius: 20px; padding: 40px 30px; text-align: center;
            max-width: 85vw; width: 400px; box-shadow: 0 0 50px rgba(212, 175, 55, 0.5), inset 0 0 20px rgba(212, 175, 55, 0.15); transform: scale(0.8) translateY(-50px); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #center-modal.active .modal-content { transform: scale(1) translateY(0); }
        .modal-icon { font-size: 55px; margin-bottom: 20px; animation: floatIcon 3s infinite ease-in-out; filter: drop-shadow(0 0 20px rgba(255,255,255,0.6)); }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .modal-text { color: var(--text-light); font-size: 1.4rem; line-height: 1.6; margin-bottom: 30px; font-style: italic; text-shadow: 0 2px 5px #000; }
        .modal-btn { background: var(--gold-primary); color: #000; border: none; padding: 12px 35px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(212, 175, 55, 0.5); transition: all 0.3s; }
        .modal-btn:hover { background: var(--gold-light); transform: scale(1.1); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.8); }

        /* ==========================================================================
           BÖLÜM 6: GİZLİ MAVİ KUTUP YILDIZI
           ========================================================================== */
        #hidden-blue-star { position: fixed; top: 18%; left: 15%; width: 45px; height: 45px; z-index: var(--z-particles); cursor: pointer; display: flex; justify-content: center; align-items: center; animation: breatheStar 4s infinite alternate; }
        .blue-star-shape { position: relative; width: 100%; height: 100%; background: var(--blue-primary); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); box-shadow: 0 0 25px var(--blue-primary); transition: all 0.3s; }
        .blue-star-aura { position: absolute; width: 250%; height: 250%; background: radial-gradient(circle, rgba(0, 240, 255, 0.5) 0%, transparent 70%); border-radius: 50%; z-index: -1; animation: spinAura 12s linear infinite; }
        @keyframes breatheStar { 0% { transform: scale(0.6) rotate(0deg); filter: brightness(0.8); } 100% { transform: scale(1.1) rotate(20deg); filter: brightness(1.5) drop-shadow(0 0 20px var(--blue-primary)); } }
        @keyframes spinAura { 100% { transform: rotate(360deg); } }

        /* ==========================================================================
           BÖLÜM 7: ETKİLEŞİM EFEKTLERİ
           ========================================================================== */
        .butterfly { position: fixed; font-size: 45px; z-index: var(--z-butterflies); cursor: pointer; pointer-events: auto !important; filter: drop-shadow(0 0 12px rgba(0, 195, 255, 0.8)); animation-fill-mode: forwards; animation-timing-function: linear; }
        @keyframes flyPath1 { 0% { transform: translate3d(0, 110vh, 0) rotate(0deg) scale(0.8); opacity: 0; } 10% { opacity: 1; } 30% { transform: translate3d(50px, 70vh, 0) rotate(15deg) scale(1.1); } 60% { transform: translate3d(-40px, 40vh, 0) rotate(-15deg) scale(0.9); } 90% { opacity: 1; } 100% { transform: translate3d(20px, -20vh, 0) rotate(0deg) scale(1); opacity: 0; } }
        @keyframes flyPath2 { 0% { transform: translate3d(0, 110vh, 0) rotate(-20deg) scale(1); opacity: 0; } 20% { opacity: 1; } 50% { transform: translate3d(-70px, 50vh, 0) rotate(20deg) scale(1.2); } 80% { transform: translate3d(60px, 10vh, 0) rotate(-10deg) scale(1); opacity: 1; } 100% { transform: translate3d(0, -20vh, 0) rotate(0deg) scale(0.8); opacity: 0; } }
        .shooting-star-container { position: fixed; top: -100px; right: -100px; width: 150px; height: 150px; z-index: var(--z-shooting-stars); cursor: pointer; animation: starShootAnim 7s linear forwards; pointer-events: auto; }
        .shooting-star-core { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: #fff; box-shadow: 0 0 25px #fff, 0 0 50px var(--gold-primary); border-radius: 50%; transform: translate(-50%, -50%); }
        .shooting-star-tail { position: absolute; top: 50%; right: 50%; width: 250px; height: 3px; background: linear-gradient(270deg, #fff, var(--gold-primary), transparent); transform-origin: right; transform: translateY(-50%) rotate(35deg); }
        @keyframes starShootAnim { 0% { transform: translate(0, 0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-150vw, 150vh); opacity: 0; } }
        .heart-particle { position: fixed; font-size: 30px; z-index: 99999; pointer-events: none; animation: popOutAnim 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
        @keyframes popOutAnim { 0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(var(--rot)); opacity: 0; } }
        .ripple-effect { position: fixed; border: 2px solid rgba(0, 240, 255, 0.8); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); animation: rippleExpand 1s ease-out forwards; z-index: var(--z-interactions); box-shadow: 0 0 25px rgba(0, 240, 255, 0.5) inset, 0 0 25px rgba(0, 240, 255, 0.5); }
        @keyframes rippleExpand { 0% { width: 0; height: 0; opacity: 1; border-width: 5px; } 100% { width: 160px; height: 160px; opacity: 0; border-width: 0px; } }
        .brush-mark { position: fixed; background: radial-gradient(circle, #ffd700 0%, #d4af37 60%, transparent 100%); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: var(--z-interactions); animation: fadeBrush 0.8s ease-out forwards; mix-blend-mode: screen; }
        @keyframes fadeBrush { 0% { opacity: 0.9; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.1); } }
        #time-lock { position: fixed; bottom: 30px; right: 30px; font-size: 40px; opacity: 0.7; cursor: pointer; z-index: var(--z-toast); transition: all 0.4s; animation: floatLock 4s infinite ease-in-out; filter: drop-shadow(0 0 20px var(--gold-primary)); }
        #time-lock:hover { opacity: 1; transform: scale(1.2); }
        @keyframes floatLock { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* ==========================================================================
           BÖLÜM 8: FİNAL YAZI (MAVİ DAMLA YAZISI EKLENDİ)
           ========================================================================== */
        #magic-text-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        #giant-name {
            font-family: 'Great Vibes', cursive; font-size: 7.5rem; 
            color: var(--blue-primary); 
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.9), 0 0 15px #fff; 
            opacity: 0; transform: scale(0.5); transition: all 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #giant-name.show { opacity: 1; transform: scale(1); }
        
        #typewriter-text { margin-top: 30px; font-size: 1.6rem; color: #fff; text-align: center; max-width: 85%; min-height: 90px; font-style: italic; text-shadow: 0 4px 20px rgba(0,0,0,1); line-height: 1.6; }
        .cursor-blink { display: inline-block; width: 3px; height: 1.4rem; background-color: var(--gold-primary); margin-left: 5px; animation: blinker 0.8s infinite; vertical-align: middle; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- Yükleme Ekranı -->
    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div class="loader-text">Damla'nın dünyasına bağlanılıyor...</div>
    </div>

    <!-- SİHRİ BAŞLAT EKRANI -->
    <div id="start-overlay">
        <button class="start-btn" id="btn-start">Sihri Başlat ✨</button>
    </div>

    <audio id="bg-audio" loop></audio>

    <div class="art-background" id="parallax-bg"></div>
    <canvas id="particle-canvas"></canvas>
    
    <div id="hidden-blue-star"><div class="blue-star-aura"></div><div class="blue-star-shape"></div></div>
    <div id="time-lock">⏳</div>

    <div id="magic-text-container">
        <div id="giant-name">Damla</div>
        <div id="typewriter-text"></div>
    </div>

    <div class="card-wrapper" id="main-card">
        <div class="card">
            <h1>Merhaba Damla</h1>
            <p class="message">Ekranda uçuşan mavi kelebeklerden birini yakalamayı dene...</p>
            <div class="button-group">
                <button class="btn-magic" onclick="triggerMagic('1', event)">İyi</button>
                <button class="btn-magic" onclick="triggerMagic('2', event)">Çok İyi</button>
            </div>
        </div>
    </div>

    <div id="center-modal">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">✨</div>
            <div class="modal-text" id="modal-text">Mesaj buraya gelecek...</div>
            <button class="modal-btn" id="modal-close-btn">Gülümsedim</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           BÖLÜM 1: GENEL AYARLAR VE YENİ ŞARKI DOSYALARI (1.mp3, 2.mp3)
           ========================================================================== */
        const CONFIG = {
            texts: {
                msg1: "Klimt bu tabloyu çizerken dünyanın en güzel altın sarısını kullandı... Ama sanırım o mavi bakışlarına hiç denk gelmemişti.",
                msg2: "Tarihin en ünlü eserleri altın yaldızlarla işlenmiş olabilir, ama bence o mavi gözlerin hiçbir tabloya sığmayacak kadar güzel..."
            },
            audio: { 
                gunduz: "2.mp3", // Sabah 06:00'dan Akşam 19:00'a kadar çalacak
                gece: "1.mp3"    // Akşam 19:00'dan Sabah 06:00'ya kadar çalacak
            },
            timings: { butterflySpawnRate: 1800, shootingStarRate: 10000, longPressDuration: 2500, typewriterSpeed: 50 },
            particles: { canvasStarCount: 100, connectionDistance: 130 }
        };

        const els = {
            loading: document.getElementById('loading-screen'),
            startOverlay: document.getElementById('start-overlay'),
            btnStart: document.getElementById('btn-start'),
            audio: document.getElementById('bg-audio'),
            cardWrap: document.getElementById('main-card'),
            bg: document.getElementById('parallax-bg'),
            modal: document.getElementById('center-modal'),
            modalIcon: document.getElementById('modal-icon'),
            modalText: document.getElementById('modal-text'),
            modalBtn: document.getElementById('modal-close-btn'),
            timeLock: document.getElementById('time-lock'),
            blueStar: document.getElementById('hidden-blue-star'),
            giantName: document.getElementById('giant-name'),
            typewriter: document.getElementById('typewriter-text'),
            canvas: document.getElementById('particle-canvas')
        };

        let isAppActive = false;
        let starCatchCount = 0;
        let magicStarted = false;

        /* ==========================================================================
           BÖLÜM 2: YÜKLEME VE İZİN ALMA (KESİN ÇÖZÜMLÜ MÜZİK)
           ========================================================================== */
        window.addEventListener('load', () => {
            setMusicByTime();
            setTimeout(() => {
                els.loading.style.opacity = '0';
                setTimeout(() => {
                    els.loading.style.display = 'none';
                    els.startOverlay.style.display = 'flex';
                }, 1000);
            }, 2000);
        });

        function setMusicByTime() {
            const hour = new Date().getHours();
            let currentSong = "";
            
            if (hour >= 6 && hour < 19) {
                currentSong = CONFIG.audio.gunduz;
            } else {
                currentSong = CONFIG.audio.gece;
            }
            
            els.audio.src = currentSong;
            els.audio.load();
        }

        els.btnStart.addEventListener('click', async () => {
            els.audio.play().catch(e => console.log("Ses hatası:", e));
            
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                } catch (error) { console.error(error); }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
            
            els.startOverlay.style.opacity = '0';
            setTimeout(() => {
                els.startOverlay.style.display = 'none';
                magicStarted = true;
                initCanvasParticles();
            }, 500);
        });

        /* ==========================================================================
           BÖLÜM 3: 3D JİROSKOP MOTORU
           ========================================================================== */
        function handleOrientation(e) {
            if (!e.gamma || !e.beta) return;
            const tiltX = Math.min(Math.max(e.gamma, -25), 25);
            const tiltY = Math.min(Math.max(e.beta - 45, -25), 25);
            
            els.bg.style.transform = `translate3d(${tiltX * 1.5}px, ${tiltY * 1.5}px, 0)`;
            els.cardWrap.style.transform = `translate3d(${-tiltX * 0.8}px, ${-tiltY * 0.8}px, 0) rotateY(${tiltX * 0.5}deg) rotateX(${-tiltY * 0.5}deg)`;
        }

        document.addEventListener('mousemove', (e) => {
            const moveX = (window.innerWidth / 2 - e.pageX) / 40;
            const moveY = (window.innerHeight / 2 - e.pageY) / 40;
            els.bg.style.transform = `translate3d(${-moveX * 1.5}px, ${-moveY * 1.5}px, 0)`;
            els.cardWrap.style.transform = `translate3d(${moveX}px, ${moveY}px, 0) rotateY(${moveX * 0.8}deg) rotateX(${-moveY * 0.8}deg)`;
        });

        /* ==========================================================================
           BÖLÜM 4: ZAMAN KİLİDİ VE MODAL
           ========================================================================== */
        let autoCloseModalTimer;
        function showBigNotification(icon, message, duration = 6000) {
            clearTimeout(autoCloseModalTimer);
            els.modalIcon.innerHTML = icon; els.modalText.innerHTML = message;
            els.modal.classList.add('active');
            autoCloseModalTimer = setTimeout(() => { closeModal(); }, duration);
        }
        function closeModal() { els.modal.classList.remove('active'); }
        els.modalBtn.addEventListener('click', () => { clearTimeout(autoCloseModalTimer); closeModal(); });

        function checkTimeStatus() {
            const hour = new Date().getHours();
            if (hour >= 19 || hour < 6) els.timeLock.innerHTML = '🌙';
            else els.timeLock.innerHTML = '⏳';
        }
        setInterval(checkTimeStatus, 60000); checkTimeStatus();

        els.timeLock.addEventListener('click', (e) => {
            e.stopPropagation();
            const hour = new Date().getHours();
            if (hour >= 19 || hour < 6) showBigNotification('🌙', "Bu gece o mavi gözlerin her zamankinden daha güzel parlıyor...", 7000);
            else showBigNotification('⏳', "Güneşin batmasını bekle, asıl sürpriz akşam 7'den sonra başlıyor...", 6000);
        });

        els.blueStar.addEventListener('pointerdown', (e) => {
            e.stopPropagation(); els.blueStar.style.display = 'none';
            explodeHearts(e.clientX, e.clientY, false);
            showBigNotification('💙', "Milyonlarca yıldız arasında sadece biri maviydi... Tıpkı o gözler gibi.", 8000);
        });

        setInterval(() => {
            const d = new Date(), h = d.getHours(), m = d.getMinutes();
            if ((h===11 && m===11) || (h===22 && m===22) || (h===0 && m===0)) showBigNotification('✨', `Saat şu an ${h}:${m < 10 ? '0'+m : m}... Acaba aklından ne geçiyordu?`, 8000);
        }, 60000);

        /* ==========================================================================
           BÖLÜM 5: FİZİKSEL ETKİLEŞİMLER
           ========================================================================== */
        let pressTimer; let isDrawing = false;
        function onPointerDown(e) {
            if(e.target.closest('button') || e.target.classList.contains('butterfly') || e.target.closest('#center-modal') || !magicStarted) return;
            isDrawing = true;
            let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
            spawnRipple(x, y);
            pressTimer = setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate([100, 100, 100]); 
                showBigNotification('🫀', "İşte tam olarak bu kadar özelsin...", 6000);
                els.bg.style.filter = "brightness(0.2) grayscale(0.8)"; setTimeout(() => els.bg.style.filter = "", 2500);
            }, CONFIG.timings.longPressDuration);
        }
        function onPointerUp() { clearTimeout(pressTimer); isDrawing = false; }
        function onPointerMove(e) {
            if (!isDrawing || !magicStarted) return; clearTimeout(pressTimer); 
            let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
            const brush = document.createElement('div'); brush.className = 'brush-mark';
            brush.style.left = x + 'px'; brush.style.top = y + 'px';
            const size = Math.random() * 15 + 5; brush.style.width = size + 'px'; brush.style.height = size + 'px';
            document.body.appendChild(brush); setTimeout(() => brush.remove(), 1000);
        }
        document.addEventListener('mousedown', onPointerDown); document.addEventListener('mouseup', onPointerUp); document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('touchstart', onPointerDown, {passive: false}); document.addEventListener('touchend', onPointerUp); document.addEventListener('touchmove', onPointerMove, {passive: false});
        function spawnRipple(x, y) {
            const ripple = document.createElement('div'); ripple.className = 'ripple-effect';
            ripple.style.left = x + 'px'; ripple.style.top = y + 'px';
            document.body.appendChild(ripple); setTimeout(() => ripple.remove(), 1200);
        }

        /* ==========================================================================
           BÖLÜM 6: KELEBEK VE YILDIZ AVLAMA MOTORU
           ========================================================================== */
        setInterval(() => {
            if (isAppActive || !magicStarted) return; 
            const star = document.createElement('div'); star.className = 'shooting-star-container';
            star.innerHTML = `<div class="shooting-star-core"></div><div class="shooting-star-tail"></div>`;
            star.addEventListener('pointerdown', (e) => {
                e.stopPropagation(); e.preventDefault(); star.remove(); starCatchCount++;
                let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
                explodeHearts(x, y, true); 
                if (starCatchCount === 1) showBigNotification('🌠', "Hemen içinden bir dilek tut...", 6000);
                else showBigNotification('✨', "Kim bilir, belki de o tuttuğun dilek çoktan kabul olmuştur...", 7000);
            });
            document.body.appendChild(star); setTimeout(() => { if (document.body.contains(star)) star.remove(); }, 7500);
        }, CONFIG.timings.shootingStarRate);

        setInterval(() => {
            if (isAppActive || !magicStarted) return;
            const b = document.createElement('div'); b.innerHTML = '🦋'; b.className = 'butterfly';
            b.style.left = (Math.random() * 80 + 10) + 'vw'; const duration = Math.random() * 4 + 5; b.style.animationDuration = duration + 's';
            b.style.animationName = Math.random() > 0.5 ? 'flyPath1' : 'flyPath2';
            b.addEventListener('pointerdown', (e) => {
                e.preventDefault(); e.stopPropagation(); b.remove(); 
                let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
                explodeHearts(x, y, false); 
            });
            document.body.appendChild(b); setTimeout(() => { if (document.body.contains(b)) b.remove(); }, duration * 1000);
        }, CONFIG.timings.butterflySpawnRate);

        function explodeHearts(x, y, isGoldMode = false) {
            const emojis = isGoldMode ? ['✨', '⭐', '🌟', '💫'] : ['💙', '💛', '💖', '🦋']; const particleCount = isGoldMode ? 14 : 9; 
            for(let i = 0; i < particleCount; i++) {
                const p = document.createElement('div'); p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)]; p.className = 'heart-particle';
                p.style.left = x + 'px'; p.style.top = y + 'px';
                const angle = Math.random() * Math.PI * 2, velocity = Math.random() * 160 + 100;
                p.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`); p.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`); p.style.setProperty('--rot', `${(Math.random() - 0.5) * 360}deg`);
                document.body.appendChild(p); setTimeout(() => { if(document.body.contains(p)) p.remove(); }, 1000);
            }
        }

        /* ==========================================================================
           BÖLÜM 7: FİNAL HİKAYE VE MAVİ DAMLA YAZISI
           ========================================================================== */
        function typeWriterEffect(text, index, element, callback) {
            if (index === 0) element.innerHTML = '<span class="cursor-blink"></span>';
            if (index < text.length) {
                element.innerHTML = text.substring(0, index + 1) + '<span class="cursor-blink"></span>';
                setTimeout(() => typeWriterEffect(text, index + 1, element, callback), CONFIG.timings.typewriterSpeed); 
            } else { if(callback) callback(); }
        }

        function triggerMagic(type, e) {
            e.stopPropagation(); if(isAppActive) return; isAppActive = true;
            els.cardWrap.classList.add('hide'); els.timeLock.style.display = 'none'; els.blueStar.style.display = 'none'; els.typewriter.innerHTML = '';
            els.bg.style.filter = "brightness(0.3)";
            setTimeout(() => {
                els.giantName.classList.add('show');
                setTimeout(() => {
                    const message = type == "1" ? CONFIG.texts.msg1 : CONFIG.texts.msg2;
                    typeWriterEffect(message, 0, els.typewriter, () => { setTimeout(resetMagicScene, 8000); });
                }, 1500);
            }, 600);
        }

        function resetMagicScene() {
            els.giantName.classList.remove('show'); els.typewriter.innerHTML = ''; els.bg.style.filter = ""; 
            setTimeout(() => { els.cardWrap.classList.remove('hide'); els.timeLock.style.display = 'block'; isAppActive = false; }, 2000);
        }

        /* ==========================================================================
           BÖLÜM 8: CANVAS YILDIZ AĞI MOTORU
           ========================================================================== */
        function initCanvasParticles() {
            const ctx = els.canvas.getContext('2d'); let particles = [];
            function resizeCanvas() { els.canvas.width = window.innerWidth; els.canvas.height = window.innerHeight; }
            window.addEventListener('resize', resizeCanvas); resizeCanvas();

            class ConstellationParticle {
                constructor() { this.x = Math.random() * els.canvas.width; this.y = Math.random() * els.canvas.height; this.vx = (Math.random() - 0.5) * 0.6; this.vy = (Math.random() - 0.5) * 0.6; this.radius = Math.random() * 2 + 0.5; this.baseAlpha = Math.random() * 0.6 + 0.1; }
                update() { this.x += this.vx; this.y += this.vy; if (this.x < 0) this.x = els.canvas.width; if (this.x > els.canvas.width) this.x = 0; if (this.y < 0) this.y = els.canvas.height; if (this.y > els.canvas.height) this.y = 0; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(212, 175, 55, ${this.baseAlpha})`; ctx.fill(); }
            }

            for (let i = 0; i < CONFIG.particles.canvasStarCount; i++) particles.push(new ConstellationParticle());

            let mouse = { x: null, y: null };
            window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; }); window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
            window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }, {passive: true}); window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

            function animateCanvasEngine() {
                ctx.clearRect(0, 0, els.canvas.width, els.canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(); particles[i].draw();
                    for (let j = i; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < CONFIG.particles.connectionDistance) { ctx.beginPath(); ctx.strokeStyle = `rgba(212, 175, 55, ${0.25 - distance/CONFIG.particles.connectionDistance})`; ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                    }
                    if (mouse.x != null) {
                        const dx = particles[i].x - mouse.x, dy = particles[i].y - mouse.y, distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance < 160) { ctx.beginPath(); ctx.strokeStyle = `rgba(0, 240, 255, ${0.5 - distance/160})`; ctx.lineWidth = 1; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); particles[i].x += dx * 0.005; particles[i].y += dy * 0.005; }
                    }
                }
                requestAnimationFrame(animateCanvasEngine);
            }
            animateCanvasEngine(); 
        }
    </script>
</body>
