<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merhaba Damla</title>
    <!-- Sanatsal ve zarif yazı tipleri -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', serif; /* Sanat konsepti için Serif font */
        }

        body {
            background-color: #0c0804;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            perspective: 1000px;
        }

        /* The Kiss Tablosu Arka Planı */
        .art-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Tablonun yüksek çözünürlüklü linki ve üzerine karanlık/altın rengi bir filtre */
            background: linear-gradient(rgba(12, 8, 4, 0.7), rgba(26, 17, 5, 0.85)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg');
            background-size: cover;
            background-position: center 20%;
            z-index: 0;
            animation: slowPan 30s infinite alternate ease-in-out;
        }

        @keyframes slowPan {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Süzülen Altın Tozları */
        .gold-dust-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .dust {
            position: absolute;
            background: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700;
            animation: floatUp 6s infinite ease-in-out;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Ana Kart */
        .card-wrapper {
            position: relative;
            z-index: 10;
            perspective: 1000px;
        }

        .card {
            background: rgba(20, 15, 10, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.3); /* Altın rengi sınır */
            padding: 45px 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 420px;
            width: 90vw;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(212, 175, 55, 0.15);
            transition: transform 0.1s ease, opacity 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform-style: preserve-3d;
        }

        .card-wrapper.hide .card {
            transform: scale(0.6) translateY(80px) rotateX(30deg) !important;
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #d4af37; /* Klasik Altın */
            font-weight: 600;
            letter-spacing: 2px;
            transform: translateZ(30px);
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }

        p.message {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 35px;
            color: #e8dcc4;
            transform: translateZ(20px);
            font-style: italic;
        }

        /* Butonlar */
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            transform: translateZ(40px);
        }

        button {
            padding: 12px 28px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.4), transparent);
            transition: all 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }

        /* Büyü / Partikül Konteyneri */
        #magic-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* Klimt Geometrik Partikülleri */
        .particle {
            position: absolute;
            top: 50%; left: 50%;
            opacity: 0;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }
        .particle.square {
            width: 8px; height: 8px; background: #d4af37;
        }
        .particle.circle {
            width: 10px; height: 10px; border-radius: 50%; background: #ffdf00;
        }
        .particle.diamond {
            width: 8px; height: 8px; background: #e8dcc4; transform: rotate(45deg);
        }

        /* Dev İsim */
        #big-name {
            font-family: 'Great Vibes', cursive;
            font-size: 7.5rem;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.6), 0 0 40px rgba(212, 175, 55, 0.3);
            opacity: 0;
            transform: scale(0.85);
            transition: all 1.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #big-name.show {
            opacity: 1; transform: scale(1);
        }

        /* Daktilo Efektli İltifat Metni */
        #final-message {
            margin-top: 25px;
            font-size: 1.4rem;
            color: #fdf5e6;
            text-align: center;
            max-width: 85%;
            min-height: 80px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.8);
            font-style: italic;
        }

        .cursor {
            display: inline-block;
            width: 2px; height: 1.2rem;
            background-color: #d4af37;
            margin-left: 5px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Arka Plan Tablo ve Altın Tozları -->
    <div class="art-background"></div>
    <div class="gold-dust-container" id="gold-dust"></div>

    <!-- Animasyon Konteyneri -->
    <div id="magic-container">
        <div id="big-name">Damla</div>
        <div id="final-message"></div>
    </div>

    <!-- 3D Kart -->
    <div class="card-wrapper" id="main-card-wrapper">
        <div class="card" id="card">
            <h1>Merhaba Damla</h1>
            <p class="message">"The Kiss" tablosunun sıcaklığına gizlenmiş ufak bir detay için tıkla...</p>
            
            <div class="button-group">
                <button onclick="triggerMagic(1)">İyi</button>
                <button onclick="triggerMagic(2)">Çok İyi</button>
            </div>
        </div>
    </div>

    <script>
        // Mavi gözlere ve sanata atıfta bulunan çok zarif, flörtöz ama abartısız sözler
        const messages = {
            1: "Klimt bu tabloyu çizerken dünyanın en güzel altın sarısını kullandı... Ama sanırım o mavi bakışlarına hiç denk gelmemişti.",
            2: "Tarihin en ünlü eserleri altın yaldızlarla işlenmiş olabilir, ama bence o mavi gözlerin hiçbir tabloya sığmayacak kadar güzel..."
        };

        let isAnimating = false;

        // --- 1. 3D KART EFEKTİ ---
        const card = document.getElementById('card');
        document.addEventListener('mousemove', (e) => {
            if(isAnimating) return;
            let xAxis = (window.innerWidth / 2 - e.pageX) / 35;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 35;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            if(isAnimating) return;
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- 2. DAKTİLO EFEKTİ ---
        function typeWriter(text, i, elementId) {
            if (i === 0) {
                document.getElementById(elementId).innerHTML = '<span class="cursor"></span>';
            }
            if (i < text.length) {
                document.getElementById(elementId).innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
                setTimeout(() => typeWriter(text, i + 1, elementId), 45); 
            }
        }

        // --- 3. ANA ANİMASYONU BAŞLATMA ---
        function triggerMagic(type) {
            if(isAnimating) return;
            isAnimating = true;

            const cardWrapper = document.getElementById('main-card-wrapper');
            const bigName = document.getElementById('big-name');
            const finalMessage = document.getElementById('final-message');
            
            // Kartı gizle
            cardWrapper.classList.add('hide');
            finalMessage.innerHTML = '';

            // Klimt tarzı geometrik altın patlaması
            createKlimtExplosion();

            // Yazıları göster
            setTimeout(() => {
                bigName.classList.add('show');
                setTimeout(() => {
                    typeWriter(messages[type], 0, 'final-message');
                }, 1200);
            }, 600);

            // 12 saniye sonra başa sar
            setTimeout(() => {
                bigName.classList.remove('show');
                finalMessage.innerHTML = '';
                setTimeout(() => {
                    cardWrapper.classList.remove('hide');
                    isAnimating = false;
                }, 1500);
            }, 12000);
        }

        // Klimt tarzı geometrik şekiller (kare, daire, elmas)
        function createKlimtExplosion() {
            const container = document.getElementById('magic-container');
            const shapes = ['square', 'circle', 'diamond'];

            for (let i = 0; i < 60; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.classList.add(shapes[Math.floor(Math.random() * shapes.length)]);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 80 + Math.random() * 250;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                particle.animate([
                    { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: 1500 + Math.random() * 1500,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
                    fill: 'forwards'
                });

                container.appendChild(particle);
                setTimeout(() => { particle.remove(); }, 3000);
            }
        }

        // Arka plan süzülen altın tozları
        const dustContainer = document.getElementById('gold-dust');
        for (let i = 0; i < 40; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            dust.style.left = `${Math.random() * 100}%`;
            const size = Math.random() * 4 + 2;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.animationDuration = `${Math.random() * 5 + 4}s`;
            dust.style.animationDelay = `${Math.random() * 5}s`;
            dustContainer.appendChild(dust);
        }
    </script>
</body>
</html>
